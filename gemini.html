   金鑰放在 x-goog-api-key 標頭，不放進網址 */
async function geminiGenerate({model, system, parts, json, temperature = 0.2, what = 'Gemini', tools, thinking}){
  const m = String(model || DEFAULT_NOTE_MODEL).replace(/^models\//, '');
  const body = {contents:[{role:'user', parts}], generationConfig:{temperature}};
  if(thinking) body.generationConfig.thinkingConfig = {thinkingLevel:thinking};   // 例如 'minimal'：少想、快答
  if(system) body.systemInstruction = {parts:[{text:system}]};
  if(json) body.generationConfig.responseMimeType = 'application/json';
  if(tools) body.tools = tools;
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(m) + ':generateContent', {
    method:'POST',
    headers:{'x-goog-api-key':settings.googleKey, 'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const msg = (data.error && data.error.message) || ('HTTP ' + res.status);
    log(what + ' 失敗 HTTP ' + res.status + '（模型 ' + m + '）', data.error);
    if(/API key not valid|API_KEY_INVALID/i.test(msg)) throw new Error('Google 金鑰不正確，請到「設定」重新貼上。');
    if(res.status === 402) throw new Error('Google 帳戶的儲值餘額用完了，請到 AI Studio 儲值。');
    if(res.status === 404) throw new Error('找不到模型 ' + m + '（可能已停用或名稱打錯），請到「設定」換一個。');
    if(res.status === 429) throw new Error('用量超過上限（免費版有每分鐘次數限制），等一下再試，或到 AI Studio 儲值。');
    if(res.status === 403) throw new Error('這把金鑰沒有權限用 ' + m + '：' + msg);
    throw new Error(msg);
  }
  const cand = data.candidates && data.candidates[0];
  const text = cand && cand.content && cand.content.parts ? cand.content.parts.filter(p => p.text && !p.thought).map(p => p.text).join('') : '';
  if(!text){
    const why = (data.promptFeedback && data.promptFeedback.blockReason) || (cand && cand.finishReason) || '沒有內容';
    log(what + ' 回覆是空的', data);
    throw new Error('模型沒有回覆文字（' + why + '）');
  }
  return text;
}

function normWords(t){ return String(t || '').toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function teacherCovered(c, reply){
  const R = normWords(reply);
  if(!R) return false;
  const corr = normWords(c.correct);
  if(corr && R.includes(corr)) return true;
  const wrong = new Set(normWords(c.wrong).split(' '));
  const diff = corr.split(' ').filter(w => w && !wrong.has(w));
  const words = new Set(R.split(' '));
  return diff.length > 0 && diff.every(w => words.has(w)) && /try saying|you said|instead|should|we say|use |say "/i.test(reply);
}

function settleTurn(u){
  if(!u || u.settled || !u.review || !u.replyDone) return;
  u.settled = true;
  const out = u.review;
  if(out.failed) return;
  // 筆記員在錄音裡聽不到清楚的話：標「沒聽到」，不記筆記
  if(!out.heard){
    if(u.bubble && !(u.transcript || '').trim()) setText(u.bubble, '（沒聽到）', true);
    log('筆記員：這句錄音裡沒有清楚的話，不記筆記');
    setNoteStatus('✎ 這句沒聽清楚');
    return;
  }
  const real = out.corrections.filter(c => c && c.wrong && c.correct);
  // 習慣清單的錯：不進右欄、不進錯誤分組，記在這一句和這堂課（字幕標記、成功率用）
  u.heard = out.heard; u.habits = out.habits; u.chances = out.chances;
  u.pron = settings.pronNotes ? out.pronunciation.filter(x => x && x.meant).map(x => ({said:String(x.said || ''), meant:String(x.meant), tip:String(x.tip || '')})) : [];
  if(u.convo) u.convo.text = out.heard;
  if(u.bubble){
    const tx = u.bubble.querySelector('.txt');
    markText(tx, out.heard, out.habits, u.pron);
    if(real.length && out.corrected) tx._sentence = out.corrected;
    u.bubble.classList.remove('pending');
  }
  saveUserLine(u);
  if(out.habits.length) log('習慣清單：' + out.habits.map(h => h.type + ' ' + h.words + '→' + h.fix + '').join('；') + '　機會 ' + JSON.stringify(out.chances));
  for(const c of real) c.source = teacherCovered(c, u.replyText) ? 'tutor' : 'added';
  const missed = real.filter(c => c.source === 'added');
  const nat = out.natural ? [{wrong:String(out.natural.said), correct:String(out.natural.better), why:String(out.natural.why || ''), source:'added'}] : [];
  addNotes(real.concat(nat), out.pronunciation);
  if(real.length) showFix(u, out.corrected);
  const L = u.lessonRef;
  if(L){   // 記進這堂課，掛斷後拿來做課堂整理
    if(out.heard) L.sentences.push(out.heard);
    if(!L.habits) L.habits = [];
    if(out.habits.length || Object.keys(out.chances).length) L.habits.push({heard:out.heard, habits:out.habits, chances:out.chances});
    for(const c of real) L.items.push({wrong:c.wrong, correct:c.correct, why:c.why || ''});
    if(out.natural) L.natural.push({said:String(out.natural.said), better:String(out.natural.better), why:String(out.natural.why || '')});
    saveLesson(L);
  }
  const wait = u.replyDone > 0 && u.reviewDone ? u.reviewDone - u.replyDone : null;
  const timing = '重聽 ' + (u.reviewDone ? secs(u.reviewDone - u.reviewStarted) : '?') + ' 秒' +
    (wait == null ? '' : wait > 0 ? '，老師講完後 ' + secs(wait) + ' 秒才好' : '，比老師早 ' + secs(-wait) + ' 秒好');
  log('對照：' + real.length + ' 個錯，老師講到 ' + (real.length - missed.length) + ' 個，補充 ' + missed.length + ' 個（' + timing + '）');
  setNoteStatus('');

  if(u.replyText && (real.length > missed.length || /try saying|you said|instead of|we say|should be|should say|the correct|better to say|you can say/i.test(u.replyText))) checkTeacher(u, out, real);
}

function addNotes(grammar, pron){
  const added = [];

  const exists = key => shownNotes().some(n => n.key === key);   // 同一堂課不重複記；不同堂可以再記
  for(const c of grammar || []){
    if(!c || !c.wrong || !c.correct) continue;
    const key = ('g|' + c.wrong + '|' + c.correct).toLowerCase();
    if(exists(key)) continue;
    const n = {id:Date.now() + Math.random(), key, type:'grammar', wrong:c.wrong, correct:c.correct, why:c.why || '', source:c.source || 'tutor', date:today, lesson:noteLesson};
    notes.unshift(n); added.push(n);
  }
  if(settings.pronNotes){
    for(const p of pron || []){
      if(!p || !p.meant) continue;
      const key = ('p|' + (p.said || '') + '|' + p.meant).toLowerCase();
      if(exists(key)) continue;
      const n = {id:Date.now() + Math.random(), key, type:'pron', said:p.said || '', meant:p.meant, tip:p.tip || '', date:today, lesson:noteLesson};
      notes.unshift(n); added.push(n);

   改動超過一半（或比對不出來）就改回兩行：灰色原句＋下一行紅色正確句。 */
function wordDiff(a, b){
  const A = String(a).trim().split(/\s+/).filter(Boolean), B = String(b).trim().split(/\s+/).filter(Boolean);
  const norm = w => w.toLowerCase().replace(/[^a-z0-9']/g, '');
  const n = A.length, m = B.length;
  if(!n || !m || n * m > 40000) return null;
  const L = Array.from({length:n + 1}, () => new Array(m + 1).fill(0));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--)
    L[i][j] = norm(A[i]) === norm(B[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while(i < n || j < m){
    if(i < n && j < m && norm(A[i]) === norm(B[j])){ ops.push({t:'=', w:B[j]}); i++; j++; }
    else if(i < n && (j >= m || L[i + 1][j] >= L[i][j + 1])){ ops.push({t:'-', w:A[i]}); i++; }
    else { ops.push({t:'+', w:B[j]}); j++; }
  }
  return ops;
}
function grammarLines(wrong, correct){

  // 字的順序換掉（刪掉的字又在別處加回來）也算太亂，用兩行
  const nrm = w => w.toLowerCase().replace(/[^a-z0-9']/g, '');
  const dels = new Set(ops ? ops.filter(o => o.t === '-').map(o => nrm(o.w)) : []);
  const moved = ops && ops.some(o => o.t === '+' && dels.has(nrm(o.w)));

  const tooMany = ops && (ops.filter(o => o.t === '-').length > Math.max(1, nW / 2) || ops.filter(o => o.t === '+').length > Math.max(1, mW / 2));
  if(ops && changed && !tooMany && !moved){
    const p = el('p', 'line diff'), parts = [];
    for(let k = 0; k < ops.length;){
      if(ops[k].t === '='){ parts.push(document.createTextNode(ops[k].w)); k++; continue; }
      const del = [], add = [];
      while(k < ops.length && ops[k].t !== '='){ (ops[k].t === '-' ? del : add).push(ops[k].w); k++; }
      if(del.length) parts.push(el('del', null, del.join(' ')));
      if(add.length) parts.push(el('span', 'add', add.join(' ')));

    parts.forEach((x, k) => { if(k) p.appendChild(document.createTextNode(' ')); p.appendChild(x); });

// 手機筆記條：最新一則（只顯示正確的那一行＋原因），新筆記時往上捲進來
function stripLines(n){
  const out = [];
  if(n.type === 'pron'){
    const l = el('p', 'line'); l.appendChild(el('span', 'pron-word', n.meant));
    if(n.said) l.appendChild(document.createTextNode('　聽起來像 ' + n.said));
    out.push(l); if(n.tip) out.push(el('p', 'meaning', n.tip));
  }else{

  }

}
let stripTimer = null;
function renderStrip(animate){
  const box = $('stripLatest');

  if(first) stripLines(first).forEach(x => sl.appendChild(x));
  else sl.appendChild(el('p', 'meaning', '糾正過的句子會記在這裡'));

// 句子太長：從錯字附近開始顯示，前面用「…」代替，讓紅色的字一定看得到
function fitLine(sl){
  const p = sl.querySelector('p.diff'); if(!p || !phoneStrip()) return;
  if(p._o == null) p._o = p.innerHTML; else p.innerHTML = p._o;
  if(p.scrollWidth <= p.clientWidth) return;
  const mark = p.querySelector('.add') || p.querySelector('del'), first = p.querySelector('del,.add');
  if(!mark) return;
  const ell = el('span', 'ell', '… '); p.insertBefore(ell, p.firstChild);
  const room = parseFloat(getComputedStyle(p).fontSize) * 1.5;
  for(let k = 0; k < 200; k++){
    if(mark.getBoundingClientRect().right <= p.getBoundingClientRect().right - room) break;   // 句尾的「…」也要佔位置
    let x = ell.nextSibling;
    while(x && x.nodeType === 3 && !x.textContent.trim()){ const y = x.nextSibling; x.remove(); x = y; }
    if(!x || x === first) break;
    x.remove();
  }
  while(ell.nextSibling && ell.nextSibling.nodeType === 3 && !ell.nextSibling.textContent.trim()) ell.nextSibling.remove();
}
function fitStrip(){ $('stripLatest').querySelectorAll('.sl').forEach(fitLine); }
window.addEventListener('resize', fitStrip);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitStrip);
$('nbOpen').addEventListener('change', () => setTimeout(fitStrip, 0));
// 手機筆記本像抖音留言區：頂端那條可以拖，放開自動彈開或收起（PENDING N1）
(() => {
  const head = document.querySelector('.note-head'), lay = document.querySelector('.layout'), col = document.querySelector('.note-col'), cb = $('nbOpen'), MIN = 64;
  let y0 = 0, t0 = 0, h0 = 0, down = false, moved = false, skip = false;
  head.addEventListener('pointerdown', e => {
    if(!PHONE.matches || e.button) return;
    y0 = e.clientY; t0 = e.timeStamp; h0 = col.getBoundingClientRect().height; down = true; moved = false;
  });
  head.addEventListener('pointermove', e => {
    if(!down) return;
    const dy = e.clientY - y0;
    if(!moved && Math.abs(dy) > 6){ moved = true; try{ head.setPointerCapture(e.pointerId); }catch(err){} }
    if(!moved || !cb.checked) return;
    lay.classList.add('dragging');
    lay.style.setProperty('--sheet-drag', Math.max(MIN, Math.min(h0, h0 - dy)) + 'px');
  });
  const end = e => {
    if(!down) return;
    down = false;
    lay.classList.remove('dragging');
    if(!moved){ lay.style.removeProperty('--sheet-drag'); return; }
    skip = true; setTimeout(() => { skip = false; }, 400);   // 拖完放開不算點一下
    const dy = e.clientY - y0, v = dy / Math.max(1, e.timeStamp - t0);
    if(!cb.checked){ if(dy < -20){ cb.checked = true; setTimeout(fitStrip, 0); } return; }
    const h = col.getBoundingClientRect().height;
    lay.style.removeProperty('--sheet-drag');
    if(v > 0.5 || h < (h0 + MIN) / 2){ cb.checked = false; setTimeout(fitStrip, 0); }
  };
  head.addEventListener('pointerup', end);
  head.addEventListener('pointercancel', () => { down = false; lay.classList.remove('dragging'); lay.style.removeProperty('--sheet-drag'); });
  head.addEventListener('click', e => { if(skip){ e.preventDefault(); skip = false; } });
})();

/* ---------- 課堂整理 ---------- */
function saveLesson(L){
  if(!lessons.includes(L)) lessons.unshift(L);
  store.set('sngm_lessons', lessons);
  if($('lessons').open) renderLessons();
}
function lessonPrompt(){
  const lang = noteLangName();
  return `You are the learner's English tutor writing an after-class review of today's speaking lesson. The learner will read it again and again, so keep it short and easy to scan: key points, not long lists.
You get every mistake noted in the lesson (one per line: wrong -> correct (why)), more natural phrasings that were suggested, and the sentences the learner said.
1. "groups": merge mistakes of the same kind into one group, for example forgetting the article a/an/the, past tense, wrong word or word form (like "effection" instead of "effectively"), word order, prepositions. Every mistake belongs to exactly one group; a one-off mistake can be its own group. Fields:
   - "name": short group name in ${lang}
   - "count": how many of the listed mistakes are in this group
   - "rule": the point to remember, 1 or 2 short sentences in ${lang}, true for every mistake in the group
   - "examples": at most 2 of the clearest ones, each {"wrong": "...", "correct": "..."}, trimmed to the few words that matter
   Sort by count, largest first. Only use mistakes from the list; never invent new ones.
2. "natural": the more natural phrasings, duplicates merged, at most 5, each {"said": "...", "better": "...", "why": "one short sentence in ${lang}"}.
3. "title": what the lesson was about, at most 12 words, in ${lang}.
4. "overview": 1 or 2 encouraging sentences in ${lang}: the most important thing to focus on next time.
5. "topics": up to 8 short English keywords for what the learner talked about (people, places, events, plans, interests), for example ["Tainan trip", "beef soup", "AI class presentation"].
Respond with ONLY a JSON object, no markdown fences:
{"title": "", "overview": "", "topics": [], "groups": [{"name": "", "count": 1, "rule": "", "examples": [{"wrong": "", "correct": ""}]}], "natural": [{"said": "", "better": "", "why": ""}]}`;
}
async function summarizeLesson(L){
  if(!L.items.length && !L.natural.length){
    L.summary = {title:'', overview:'這堂課沒有記到需要改的地方，很棒！', groups:[], natural:[]};
    L.status = 'done'; saveLesson(L); return;
  }
  if(!settings.googleKey){ L.status = 'error'; L.error = '沒有填 Google 金鑰，沒辦法整理。'; saveLesson(L); return; }
  L.status = 'summarizing'; L.error = ''; saveLesson(L);
  setNoteStatus('✎ 正在整理這堂課…');
  const input = 'Mistakes:\n' + (L.items.map(i => i.wrong + ' -> ' + i.correct + (i.why ? ' (' + i.why + ')' : '')).join('\n') || '(none)') +
    '\n\nMore natural phrasings:\n' + (L.natural.map(n => n.said + ' -> ' + n.better + (n.why ? ' (' + n.why + ')' : '')).join('\n') || '(none)') +
    '\n\nWhat the learner said:\n' + (L.sentences.join('\n') || '(not available)');
  try{
    const raw = await geminiGenerate({model:settings.noteModel, system:lessonPrompt(), json:true, what:'課堂整理', parts:[{text:input}]});
    const t =(raw || '').replace(/```json|```/g, ''); const a = t.indexOf('{'), b = t.lastIndexOf('}');
    let o = null; try{ o = JSON.parse(t.slice(a, b + 1)); }catch(e){}
    if(!o){ log('課堂整理看不懂', (raw || '').slice(0, 400)); throw new Error('回覆格式看不懂。'); }
    L.summary = {
      title:String(o.title || ''), overview:String(o.overview || ''),
      topics:Array.isArray(o.topics) ? o.topics.map(String).slice(0, 8) : [],
      groups:Array.isArray(o.groups) ? o.groups : [], natural:Array.isArray(o.natural) ? o.natural : []
    };
    L.status = 'done'; saveLesson(L);
    setNoteStatus('✎ 課堂整理好了');
  }catch(err){
    L.status = 'error'; L.error = '整理失敗：' + ((err && err.message) || '網路連線錯誤'); saveLesson(L);
    setNoteStatus(L.error, true);
  }
}
/* ---------- 學生小檔案（記憶）：每堂課後「改寫」一次，不是一直往後加 ---------- */

Life and plans: up to 6 bullet lines about their life, work, interests and upcoming events, each with a date if known, for example "- presenting their app in an AI class on 2026-11-20". Remove plans that are clearly over, or turn them into something to ask about ("presented on 11/20, ask how it went").
Recent lessons: one line per lesson, newest first, at most 8 lines, for example "- 2026-11-12: talked about the weekend trip to Tainan".

/* ---------- 回想（recall）：老師翻以前的課 ----------
   1. 老師說 "let me think…" 並叫用 recall(query)
   2. 課不多：把每堂的整理＋聊天文字一次交給快模型找答案
      課很多：先給快模型看「總目錄」（每堂一行），挑出最相關的幾堂，再讀那幾堂
   3. 快模型寫成兩三句交回給老師，老師接著聊 */
const RECALL_TOOL = {
  name:'recall',
  description:'Look through records of earlier lessons with this learner (what they said, topics, mistakes) and get a short answer. Takes a few seconds.',
  parameters:{type:'OBJECT', properties:{query:{type:'STRING', description:'What you want to remember, in English, e.g. "the restaurant the learner talked about" or "what we talked about last week"'}}, required:['query']}
};
// 這次通話要給老師哪些工具（setup 送出後就不能改，下次通話才生效）
function liveTools(){
  const list = [];
  if(TOOLS_ON && hasPastLessons()) list.push(RECALL_TOOL);
  if(TOOLS_ON && settings.webSearch) list.push(WEB_TOOL);
  return list.length ? {tools:[{functionDeclarations:list}]} : {};
}
function pastLessons(){ return lessons.filter(L => L.status !== 'live' && !(lesson && L.id === lesson.id)); }
function hasPastLessons(){ return pastLessons().length > 0; }
function ymd(t){ const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function indexLine(L){   // 總目錄的一行
  const s = L.summary || {};
  return '#' + L.id + ' | ' + ymd(L.start) + ' | ' + (s.title || '(no title)') +
    ((s.topics || []).length ? ' | topics: ' + s.topics.join(', ') : '') +
    ((s.groups || []).length ? ' | mistakes: ' + s.groups.map(g => g.name).join(', ') : '');

async function lessonDigest(L, max){   // 一堂課的內容：目錄那一行＋重點＋聊天文字
  const lines = await chatDb.lesson(L.id);
  let talk = lines.map(x => (x.role === 'me' ? 'Learner: ' : 'Tutor: ') + (x.text || '')).join('\n');
  if(!talk) talk = (L.sentences || []).map(s => 'Learner: ' + s).join('\n');
  if(talk.length > max) talk = talk.slice(0, max) + '\n…';
  const s = L.summary || {};
  return '=== Lesson ' + indexLine(L) + '\n' + (s.overview ? 'Summary: ' + s.overview + '\n' : '') + (talk || '(no transcript)');
}
// 回想、上網查用的文字模型：和筆記員同一個模型、同一把 Google 金鑰
function fastChat(system, user, extra){
  return geminiGenerate(Object.assign({model:settings.noteModel, system, parts:[{text:user}], temperature:0.1, what:'工具'}, extra || {})).then(t => String(t || '').trim());
}
async function runRecall(query){
  const bubble = toolBubble('recall', '回想以前的課…');
  const t0 = performance.now();
  let answer;
  try{
    if(!settings.googleKey) throw new Error('沒有 Google 金鑰');
    const past = pastLessons();
    if(!past.length){ answer = {found:false, memory:'There are no earlier lessons yet.'}; }
    else{
      let picked = past.slice(0, 40);   // 最新的在前面
      const all = await Promise.all(picked.map(L => lessonDigest(L, 4000)));
      let docs = all.join('\n\n');
      if(docs.length > 30000 || past.length > 40){
        // 課太多：先看總目錄挑出最相關的 3 堂
        const pick = await fastChat(
          'You pick which earlier lessons are relevant to a question. Reply with ONLY a JSON object like {"ids": [123, 456]} with at most 3 lesson ids (the numbers after #), most relevant first. If none look relevant, pick the 2 most recent.',
          'Today is ' + todayText() + '.\nQuestion: ' + query + '\n\nLessons (newest first):\n' + past.slice(0, 300).map(indexLine).join('\n'));
        const m = pick.match(/\{[\s\S]*\}/); let ids = [];
        try{ ids = (JSON.parse(m ? m[0] : '{}').ids || []).map(Number); }catch(e){}
        picked = past.filter(L => ids.includes(L.id)).slice(0, 3);
        if(!picked.length) picked = past.slice(0, 2);
        docs = (await Promise.all(picked.map(L => lessonDigest(L, 8000)))).join('\n\n');
        log('回想：從 ' + past.length + ' 堂挑出 ' + picked.map(L => ymd(L.start)).join(', '));
      }
      const text = await fastChat(
        'You help an English tutor remember earlier lessons with their learner. Answer the tutor\'s question using ONLY the lesson records given (transcripts are automatic and may contain misheard words). Reply in English, at most 3 short sentences, mention the lesson date when useful. If the records do not contain the answer, reply exactly: NOT FOUND',
        'Today is ' + todayText() + '.\nTutor\'s question: ' + query + '\n\n' + docs);
      answer = /^NOT FOUND/i.test(text) || !text ? {found:false, memory:'Nothing about this in the records of earlier lessons.'} : {found:true, memory:text};
    }
    setText(bubble, '回想完成（' + secs(performance.now() - t0) + ' 秒）', false);
    log('回想 "' + query + '"：' + answer.memory);
  }catch(err){
    log('回想失敗：' + (err && err.message));
    answer = {found:false, memory:'Your lesson records could not be opened right now.'};
    setText(bubble, '回想失敗：' + ((err && err.message) || '網路錯誤'), false); bubble.classList.add('failed');
  }
  setStatus('');
  return JSON.stringify(answer);
}
/* ---------- 上網查（web_search）：老師聊時事 ---------- */
const WEB_TOOL = {
  name:'web_search',
  description:'Search the web for recent news, events, products, people or new words, and get a short spoken-style summary. Takes a few seconds.',
  parameters:{type:'OBJECT', properties:{query:{type:'STRING', description:'What to look up, in English, e.g. "latest Taiwan typhoon news" or "what is vibe coding"'}}, required:['query']}
};
async function runWebSearch(query){
  const bubble = toolBubble('web', '上網查：' + query + '…');
  const t0 = performance.now();
  let answer;
  try{
    if(!settings.googleKey) throw new Error('沒有 Google 金鑰');
    const sys = 'You look things up on the web for an English tutor who is chatting with a learner. Answer the question using the search results, in plain spoken English, at most 3 short sentences, with dates when they matter. No links, no markdown, no lists. If the results do not answer it, say so in one sentence.';
    const user = 'Today is ' + todayText() + '.\nQuestion: ' + query;
    let text = await fastChat(sys, user, {tools:[{googleSearch:{}}], what:'上網查'});   // Google 搜尋
    text = text.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/https?:\/\/\S+/g, '').replace(/[*#`]/g, '').trim();
    if(!text) throw new Error('沒有查到內容');
    answer = {found:true, result:text.slice(0, 1200)};
    setText(bubble, '查好了（' + secs(performance.now() - t0) + ' 秒）：' + query, false);
    log('上網查 "' + query + '"：' + text);
  }catch(err){
    log('上網查失敗：' + (err && err.message));
    answer = {found:false, result:'The web search did not work right now. Tell the learner you could not look it up and ask them to tell you about it.'};
    setText(bubble, '上網查失敗：' + ((err && err.message) || '網路錯誤'), false); bubble.classList.add('failed');
  }
  setStatus('');
  return JSON.stringify(answer);
}

// 老師叫用工具：查好就用 toolResponse 交回去，Google 會讓老師自己接著說（接在同一個泡泡）
let toolPending = 0;            // 還在查的工具數
const toolCancelled = new Set();
function onToolCall(tc){
  for(const fc of (tc.functionCalls || [])){
    const args = fc.args || {};
    log('老師要用工具 ' + fc.name + '：' + JSON.stringify(args));
    const sock = ws;
    toolPending++;
    const p = fc.name === 'recall' ? runRecall(String(args.query || ''))
            : fc.name === 'web_search' ? runWebSearch(String(args.query || ''))
            : Promise.resolve(JSON.stringify({error:'unknown tool'}));
    p.then(out => {
      toolPending = Math.max(0, toolPending - 1);
      if(ws !== sock || toolCancelled.has(fc.id)){ log('工具 ' + fc.name + ' 查好了，但已經取消或換線，不交回'); return; }
      let response; try{ response = JSON.parse(out); }catch(e){ response = {result:String(out)}; }
      // 老師剛才那段已經講完：接著說的那段接在同一個泡泡
      if(!cur && lastTeacher && lastTeacher.bubble) continuation = Object.assign({}, lastTeacher, {prefix:lastTeacher.text + ' '});
      send({toolResponse:{functionResponses:[{id:fc.id, name:fc.name, response}]}});
      log('工具結果交回老師（' + fc.name + '）');
    });
  }
}

/* ---------- 習慣清單成功率：從最早的課照順序重算，算到「這堂課結束時」為止 ----------
   練習中：在 2 堂不同的課都犯過。畢業：最近 30 次 ≥ 90%、橫跨至少 3 堂課（只在畢業那堂顯示）。
   畢業後最近 20 次 < 80%，或一堂課錯 3 次：安靜地回到練習中。不滿 10 次顯示「累積中」。 */
function habitProgress(upTo){
  const st = {};
  for(const h of HABIT_TYPES) st[h.code] = {status:'none', outs:[], wrongLessons:new Set(), wrongHere:0, gradHere:false};
  const list = lessons.filter(L => L.status !== 'live').slice().sort((a, b) => a.start - b.start);
  for(const L of list){
    for(const t in st){ st[t].wrongHere = 0; st[t].gradHere = false; }
    for(const e of L.habits || []){
      for(const [t, v] of Object.entries(e.chances || {})){
        if(!st[t] || !Array.isArray(v)) continue;
        const n = parseInt(v[0], 10) || 0, ok = Math.min(n, parseInt(v[1], 10) || 0);
        for(let i = 0; i < n; i++) st[t].outs.push({ok:i < ok, lesson:L.id});
        if(n > ok){ st[t].wrongHere += n - ok; st[t].wrongLessons.add(L.id); }
      }
    }
    for(const t in st){
      const x = st[t], last = n => x.outs.slice(-n), rate = a => a.filter(o => o.ok).length / a.length;
      if(x.status === 'grad'){
        const r20 = last(20);
        if((r20.length && rate(r20) < 0.8) || x.wrongHere >= 3) x.status = 'practice';
      }else{
        if(x.wrongLessons.size >= 2) x.status = 'practice';
        const r30 = last(30);
        if(x.status === 'practice' && r30.length >= 30 && rate(r30) >= 0.9 && new Set(r30.map(o => o.lesson)).size >= 3){ x.status = 'grad'; x.gradHere = true; }
      }
    }
    if(L.id === upTo) break;
  }
  return HABIT_TYPES.map(h => {
    const x = st[h.code], r30 = x.outs.slice(-30);
    return {code:h.code, zh:h.zh, status:x.status, gradHere:x.gradHere, wrongHere:x.wrongHere, wrongAll:x.outs.filter(o => !o.ok).length,
      n:r30.length, pct:r30.length ? Math.round(100 * r30.filter(o => o.ok).length / r30.length) : 0};
  });
}
function habitReport(L){   // 這堂課要顯示的：最多 3 項練習中（這堂錯最多的優先），加上這堂剛畢業的
  const all = habitProgress(L.id);
  const practice = all.filter(x => x.status === 'practice').sort((a, b) => b.wrongHere - a.wrongHere || b.wrongAll - a.wrongAll).slice(0, 3);
  return {practice, grad:all.filter(x => x.gradHere)};
}
function habitRateText(x){ return x.n < 10 ? '累積中（' + x.n + '/10 次）' : '最近 ' + x.n + ' 次用對 ' + x.pct + '%'; }
/* 總目錄：上面小月曆（有課的日子上色、點點＝幾堂、今天加框；‹ › 換月、^ 收起），
   下面時間線（左邊大日期＋週幾，同一天的課疊在右邊，最新的在最上面）。日期顏色 14 天一圈（.dc0～.dc13） */
const ICON_PREV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M14 5l-7 7 7 7"/></svg>';
const ICON_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M10 5l7 7-7 7"/></svg>';
const WEEKDAYS = '一二三四五六日';
let calMonth = null;                                // 月曆顯示哪個月（那個月的 1 號）
let calOpen = store.get('sngm_calOpen', true);      // 月曆收起來了沒（記在這個瀏覽器）
function dayKey(d){ return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dateColor(d){ return 'dc' + ((Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) + 11) % 14); }   // 和定案樣稿同一套（+11 對齊 Python 的 toordinal）
function iconBtn(svg, label, cls){ const b = el('button', 'icon' + (cls ? ' ' + cls : '')); b.type = 'button'; b.innerHTML = svg; b.setAttribute('aria-label', label); b.title = label; return b; }
function renderLessonIndex(box){
  if(!lessons.length){ box.appendChild(el('p', 'empty', '還沒有課。下課後會出現在這裡。')); return; }
  const sorted = lessons.slice().sort((a, b) => b.start - a.start);
  const byDay = new Map();   // 'y-m-d' → 那天的課（新的在前）
  for(const L of sorted){ const k = dayKey(new Date(L.start)); if(!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(L); }
  const now = new Date(), thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const oldest = new Date(sorted[sorted.length - 1].start), firstMonth = new Date(oldest.getFullYear(), oldest.getMonth(), 1);
  if(!calMonth){ const d = new Date(sorted[0].start); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const goMonth = delta => {
    calMonth = new Date(y, m + delta, 1); renderLessons();
    const h = document.getElementById('mon-' + calMonth.getFullYear() + '-' + (calMonth.getMonth() + 1));
    if(h) h.scrollIntoView({block:'start'});
  };
  // 月曆
  const cal = el('div', 'cal' + (calOpen ? '' : ' closed'));
  const head = el('div', 'cal-head');
  const prev = iconBtn(ICON_PREV, '上個月'); prev.disabled = calMonth <= firstMonth; prev.onclick = () => goMonth(-1);
  const next = iconBtn(ICON_NEXT, '下個月'); next.disabled = calMonth >= thisMonth; next.onclick = () => goMonth(1);
  let days = 0, count = 0;
  for(const [k, Ls] of byDay) if(k.startsWith(y + '-' + (m + 1) + '-')){ days++; count += Ls.length; }
  const fold = iconBtn(ICON_UP, calOpen ? '收起月曆' : '打開月曆', 'calfold'); fold.setAttribute('aria-expanded', String(calOpen));
  fold.onclick = () => {
    calOpen = !calOpen; store.set('sngm_calOpen', calOpen);
    cal.classList.toggle('closed', !calOpen); fold.setAttribute('aria-expanded', String(calOpen));
    fold.title = calOpen ? '收起月曆' : '打開月曆'; fold.setAttribute('aria-label', fold.title);
  };
  head.append(prev, el('b', null, y + ' 年 ' + (m + 1) + ' 月'), next, el('span', 'hint', count ? '這個月上了 ' + days + ' 天、' + count + ' 堂' : '這個月沒有課'), fold);
  cal.appendChild(head);
  const grid = el('div', 'cal-grid');
  for(const w of WEEKDAYS) grid.appendChild(el('span', 'wd', w));
  for(let i = (new Date(y, m, 1).getDay() + 6) % 7; i > 0; i--) grid.appendChild(el('span'));
  const last = new Date(y, m + 1, 0).getDate();
  for(let dd = 1; dd <= last; dd++){
    const d = new Date(y, m, dd), Ls = byDay.get(dayKey(d)) || [];
    const b = el('button', 'd' + (Ls.length ? ' has ' + dateColor(d) : '') + (dayKey(d) === dayKey(now) ? ' today' : '')); b.type = 'button';
    b.appendChild(document.createTextNode(String(dd)));
    const dots = el('span', 'dots'); for(let i = 0; i < Math.min(Ls.length, 4); i++) dots.appendChild(el('i')); b.appendChild(dots);
    b.setAttribute('aria-label', (m + 1) + ' 月 ' + dd + ' 日' + (Ls.length ? '，' + Ls.length + ' 堂課' : ''));
    if(Ls.length) b.onclick = () => { const r = document.getElementById('day-' + dayKey(d)); if(r) r.scrollIntoView({block:'start', behavior:'smooth'}); };
    else b.disabled = true;
    grid.appendChild(b);
  }
  cal.appendChild(grid);
  box.appendChild(cal);
  // 時間線
  let month = '';
  for(const [k, Ls] of byDay){
    const d = new Date(Ls[0].start);
    const mk = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
    if(mk !== month){ month = mk; const h = el('div', 'month', mk); h.id = 'mon-' + d.getFullYear() + '-' + (d.getMonth() + 1); box.appendChild(h); }
    const row = el('div', 'day'); row.id = 'day-' + k;
    const dt = el('div', 'dt ' + dateColor(d));
    dt.append(el('b', null, String(d.getDate())), el('span', null, '週' + WEEKDAYS[(d.getDay() + 6) % 7]));
    const list = el('div');
    for(const L of Ls){
      const b = el('button', 'lrow'); b.type = 'button';
      const sp = el('span'); sp.append(el('b', null, lessonTitle(L)), el('small', null, lessonStats(L)));
      b.append(el('time', null, lessonTime(L)), sp);
      b.insertAdjacentHTML('beforeend', ICON_NEXT.replace('<svg ', '<svg class="go" '));
      b.onclick = () => { lessonView = L.id; renderLessons(); $('lessonList').scrollIntoView(); };
      list.appendChild(b);
    }
    row.append(dt, list);
    box.appendChild(row);
  }
}
let lessonUrls = [];   // 重聽用的暫時網址，換頁時釋放
async function exportLesson(L){
  const s = L.status === 'done' && L.summary;
  const out = ['# ' + lessonTitle(L), '', lessonMeta(L), ''];
  if(s){
    if(s.overview) out.push(s.overview, '');
    if(s.groups.length){
      out.push('## 錯誤重點', '');
      for(const g of s.groups){
        out.push('### ' + (g.name || '') + (g.count ? '（×' + g.count + '）' : ''));
        if(g.rule) out.push(g.rule);
        for(const e of (Array.isArray(g.examples) ? g.examples : []).slice(0, 2)) if(e && e.wrong) out.push('- ✗ ' + e.wrong + '  ', '  ✓ ' + (e.correct || ''));
        out.push('');
      }
    }
    if(s.natural.length){
      out.push('## 更道地的說法', '');
      for(const n of s.natural) out.push('- ' + (n.said || '') + ' → **' + (n.better || '') + '**' + (n.why ? '：' + n.why : ''));
      out.push('');
    }
  }
  if(L.status !== 'live'){
    const hr = habitReport(L);
    if(hr.practice.length || hr.grad.length){
      out.push('## 習慣清單', '');
      for(const x of hr.grad) out.push('- 🎓 畢業：' + x.zh + '　' + habitRateText(x));
      for(const x of hr.practice) out.push('- ' + x.zh + '　' + habitRateText(x));
      out.push('');
    }
  }
  const lines = await chatDb.lesson(L.id);
  if(lines.length){
    out.push('## 聊天紀錄', '');
    for(const x of lines){
      out.push('**' + (x.role === 'me' ? '我' : '老師') + '**：' + (x.role === 'me' && x.heard ? markedPlain(x.heard, x.habits) : (x.text || '')));
      if(x.fix) out.push('　✓ ' + x.fix);
      out.push('');
    }
  }
  const dt = new Date(L.start);
  const name = 'lesson-' + dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0') + '_' +
    String(dt.getHours()).padStart(2, '0') + String(dt.getMinutes()).padStart(2, '0') + '.md';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out.join('\n')], {type:'text/markdown;charset=utf-8'}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

      act.appendChild(del);

  {id:'gemini-3-flash-preview', name:'Gemini 3 Flash Preview'},
  {id:'gemini-3.1-flash-lite', name:'Gemini 3.1 Flash-Lite（便宜）'},
  {id:'gemini-3.1-pro-preview', name:'Gemini 3.1 Pro Preview（付費版才有）'}
];
let audioModels = NOTE_FALLBACK.slice(), modelsLoaded = false;
async function loadAudioModels(){
  if(modelsLoaded || !settings.googleKey) return;
  try{
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', {headers:{'x-goog-api-key':settings.googleKey}});
    const data = await res.json();
    // 只留「能寫文字」的 gemini 模型；拿掉語音、圖片、向量、Live 這些不適合當筆記員的
    const list = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => ({id:m.name.replace(/^models\//, ''), name:m.displayName || m.name}))
      .filter(m => /^gemini-/.test(m.id) && !/live|tts|image|embedding|audio|transcribe|translate|robotics|computer/i.test(m.id))
      .sort((a, b) => b.id.localeCompare(a.id));
    if(list.length){
      const fav = list.find(m => m.id === DEFAULT_NOTE_MODEL);
      if(fav) fav.name += '（推薦）';
      audioModels = list; modelsLoaded = true;
    }
  }catch(e){ $('noteModelHint').textContent = '暫時抓不到 Google 的模型清單，先顯示常用的幾個。'; }
}
// 測試金鑰：用目前選的筆記員模型送一句話
$('testKey').onclick = async () => {
  const key = $('googleKey').value.trim(), model = pickedNoteModel() || DEFAULT_NOTE_MODEL;
  const out = $('testKeyResult');
  if(!key){ out.textContent = '請先貼上金鑰。'; return; }
  out.textContent = '測試中（' + model + '）…';
  const saved = settings.googleKey; settings.googleKey = key;
  const t0 = performance.now();
  try{
    const text = await geminiGenerate({model, what:'測試金鑰', temperature:0, parts:[{text:'Reply with exactly: OK, the notebook is ready.'}]});
    out.textContent = '✓ 成功（' + model + '，' + secs(performance.now() - t0) + ' 秒）：' + text.trim().slice(0, 80);
    log('測試金鑰成功：' + model + ' → ' + text.trim());
    modelsLoaded = false; await loadAudioModels(); fillNotePicker(model);
  }catch(err){
    out.textContent = '✗ ' + ((err && err.message) || '網路連線錯誤');
  }finally{ settings.googleKey = saved; }
};
function fillNotePicker(current){
  const sel = $('noteModelSelect');
  sel.innerHTML = '';
  for(const m of audioModels){
    const o = document.createElement('option');
    o.value = m.id; o.textContent = m.name + '（' + m.id + '）'; sel.appendChild(o);
  }
  const other = document.createElement('option');
  other.value = '__custom'; other.textContent = '其他（自己輸入名稱）'; sel.appendChild(other);
  if(audioModels.some(m => m.id === current)){ sel.value = current; $('noteCustomWrap').hidden = true; }
  else{ sel.value = '__custom'; $('noteCustomWrap').hidden = false; $('noteModelCustom').value = current; }
}
function pickedNoteModel(){
  return $('noteModelSelect').value === '__custom' ? $('noteModelCustom').value.trim() : $('noteModelSelect').value;
}
function showSpeed(){ $('speedVal').textContent = Number($('speed').value).toFixed(2) + ' 倍'; }
$('speed').addEventListener('input', showSpeed);
$('noteModelSelect').addEventListener('change', () => { $('noteCustomWrap').hidden = $('noteModelSelect').value !== '__custom'; });

/* 老師提示詞模板 */
(function(){
  const sel = $('teacherTemplate');
  for(const [id, t] of Object.entries(TEACHER_TEMPLATES)){
    const o = document.createElement('option'); o.value = id; o.textContent = t.name; sel.appendChild(o);
  }
  const o = document.createElement('option'); o.value = 'custom'; o.textContent = '自訂（我改過的）'; sel.appendChild(o);
})();
let templateShown = 'tutor';   // 下拉選單目前顯示的選項，用來在使用者取消時還原
$('teacherTemplate').addEventListener('change', () => {
  const id = $('teacherTemplate').value;
  if(id === 'custom'){ templateShown = id; return; }
  const cur = $('teacherStyle').value.trim();
  const isTemplate = !cur || Object.values(TEACHER_TEMPLATES).some(t => t.text === cur);
  if(!isTemplate && !confirm('換模板會蓋掉你改過的提示詞，確定嗎？')){ $('teacherTemplate').value = templateShown; return; }
  $('teacherStyle').value = TEACHER_TEMPLATES[id].text;
  templateShown = id;
  showFixedRules();
});
$('teacherStyle').addEventListener('input', () => {
  const cur = $('teacherStyle').value.trim();
  const match = Object.entries(TEACHER_TEMPLATES).find(([, t]) => t.text === cur);
  templateShown = match ? match[0] : 'custom';
  $('teacherTemplate').value = templateShown;
});
function showFixedRules(){
  // 用目前畫面上的糾正程度和關於我，算出會自動加上的部分給使用者看
  const saved = {strict:settings.strict, aboutMe:settings.aboutMe, teacherStyle:settings.teacherStyle, teacherTemplate:settings.teacherTemplate};
  settings.strict = $('strict').value; settings.aboutMe = $('aboutMe').value.trim(); settings.teacherStyle = 'X'; settings.teacherTemplate = $('teacherTemplate').value;
  $('fixedRules').textContent = teacherPrompt().replace(/^X\n\n/, '');
  Object.assign(settings, saved);
}
$('strict').addEventListener('change', showFixedRules);
$('aboutMe').addEventListener('input', showFixedRules);

/* ---------- 設定 ---------- */
function openSettings(){
  fillNotePicker(settings.noteModel);
  loadAudioModels().then(() => { if($('settings').open) fillNotePicker(pickedNoteModel() || settings.noteModel); });
  $('noteLang').value = settings.noteLang;
  $('pronNotes').checked = settings.pronNotes;
  $('showFix').checked = settings.showFix;
  $('webSearch').checked = settings.webSearch;
  $('talkMode').value = settings.talkMode;
  $('speed').value = settings.speed; showSpeed();
  $('googleKey').value = settings.googleKey;
  $('testKeyResult').textContent = '';
  $('teacherModel').value = settings.teacherModel;
  $('strict').value = settings.strict;
  $('aboutMe').value = settings.aboutMe;
  $('profileText').value = profile.text || '';
  $('teacherStyle').value = teacherStyleText();
  templateShown = TEACHER_TEMPLATES[settings.teacherTemplate] || settings.teacherTemplate === 'custom' ? settings.teacherTemplate : 'tutor';
  $('teacherTemplate').value = templateShown;
  showFixedRules();
  $('settings').showModal();
}
$('settings').addEventListener('close', () => {
  if($('settings').returnValue !== 'save') return;
  settings.googleKey = $('googleKey').value.trim();
  settings.teacherModel = $('teacherModel').value;
  settings.strict = $('strict').value;
  settings.aboutMe = $('aboutMe').value.trim();
  const pt = $('profileText').value.trim().slice(0, PROFILE_MAX);
  if(pt !== (profile.text || '')){ profile = {text:pt, updated:Date.now()}; store.set('sngm_profile', profile); }
  settings.teacherStyle = $('teacherStyle').value.trim();
  settings.teacherTemplate = settings.teacherStyle ? $('teacherTemplate').value : 'tutor';
  settings.noteModel = pickedNoteModel() || DEFAULT_NOTE_MODEL;
  settings.noteLang = $('noteLang').value;
  settings.pronNotes = $('pronNotes').checked;
  settings.showFix = $('showFix').checked;
  settings.webSearch = $('webSearch').checked;
  document.body.classList.toggle('nofix', !settings.showFix);
  settings.talkMode = $('talkMode').value;
  settings.speed = Number($('speed').value);
  store.set('sngm_settings', settings);
  updateModeLabel();
  if(ws || callState !== 'off'){
    setStatus('設定已儲存，下次上課生效');
    switchMode(settings.talkMode);
  }
  else setStatus('設定已儲存');
});
$('clearKeys').onclick = () => {
  settings.googleKey = '';
  store.set('sngm_settings', settings);
  $('googleKey').value = '';
  $('settings').close('cancel');
  setStatus('金鑰已清除');
};
$('openSettings').onclick = openSettings;

$('call').onclick = () => {
  if(connecting) return;
  if(callState === 'off') startCall();
  else if(callState === 'auto') pauseCall();
  else if(callState === 'paused') resumeCall();
  else if(callState === 'ready') startTalking();
  else if(callState === 'talking') finishTalking();
};
$('hangup').onclick = () => sayGoodbye();
$('cancelTalk').onclick = cancelTalking;
// 課堂整理：點視窗外面（暗掉的地方）也能關。手機版是滿版，沒有外面可以點，用固定的 ×
$('lessons').addEventListener('click', e => { if(e.target === $('lessons')) $('lessons').close(); });
$('newChat').onclick = () => {
  if(ws || callState !== 'off') endCall(false);
  clearChat();
  setStatus('已開新對話');
};
/* 清空左邊的對話。畫面上那堂課有存進課堂整理，就讓它縮小飛進「課堂整理」按鈕；沒存（沒說到話）就直接清掉 */
let chatLesson = null;   // 畫面上這段對話屬於哪一堂課
function clearChat(){
  const saved = chatLesson && lessons.includes(chatLesson);
  chatLesson = null;
  if(saved && chatEl.children.length) flyToLessons();
  chatEl.innerHTML = ''; userBubbles.clear(); replies.clear(); turns.length = 0; convo.length = 0;
  lastStop = 0; waitingTurn = null; pttTurn = null; commitTurn = null; activeResponse = null;
  renderStats();
}
function flyToLessons(){
  const btn = $('openLessons');
  const from = chatEl.getBoundingClientRect(), to = btn.getBoundingClientRect();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pulse = () => { btn.classList.remove('got-lesson'); void btn.offsetWidth; btn.classList.add('got-lesson'); setTimeout(() => btn.classList.remove('got-lesson'), 1200); };
  if(still || !from.width || !to.width || !document.body.animate){ pulse(); return; }
  const ghost = chatEl.cloneNode(true);
  ghost.removeAttribute('id'); ghost.removeAttribute('aria-live'); ghost.setAttribute('aria-hidden', 'true');
  ghost.classList.add('chat-ghost');
  Object.assign(ghost.style, {left:from.left + 'px', top:from.top + 'px', width:from.width + 'px', height:from.height + 'px'});
  document.body.appendChild(ghost);
  ghost.scrollTop = chatEl.scrollTop;
  const dx = to.left + to.width / 2 - from.left, dy = to.top + to.height / 2 - from.top;
  const k = Math.min(to.width / from.width, to.height / from.height);
  const a = ghost.animate([
    {transform:'translate(0,0) scale(1)', opacity:1, borderRadius:'12px'},
    {transform:`translate(${dx * .35}px,${dy * .2}px) scale(.55)`, opacity:.95, offset:.35},
    {transform:`translate(${dx - from.width * k / 2}px,${dy - from.height * k / 2}px) scale(${k})`, opacity:.2, borderRadius:'40px'}
  ], {duration:650, easing:'cubic-bezier(.5,0,.75,0)'});
  a.onfinish = a.oncancel = () => { ghost.remove(); pulse(); };
}
window.addEventListener('beforeunload', () => {
  endCall(false);
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  stopCapture();
});

updateModeLabel();
renderNotes();
document.body.classList.toggle('nofix', !settings.showFix);
// 上次關網頁時還在等整理的課，改成「可以重新整理」
for(const L of lessons) if(L.status === 'live' || L.status === 'waiting' || L.status === 'summarizing'){ L.status = 'error'; L.error = '上次網頁關掉時還沒整理完，按「重新整理」再做一次。'; }
store.set('sngm_lessons', lessons);
setCallUI('off');
if(DEMO) showDemo();
else if(!settings.googleKey) setStatus('請先到「設定」貼上 Google AI Studio 金鑰');
/* 展示版：左欄排好範例那堂課（字幕標記、紅字、▶ 重聽、秒數），上課按鈕只提示不能用 */
function showDemo(){
  $('call').onclick = () => setStatus('展示版不能上課，接上自己的 Google 金鑰就能練習');
  // 結束課堂：老師說一句固定的道別（瀏覽器內建語音念），念完顯示「已下課」，吉祥物探頭眨眼
  $('hangup').onclick = () => {
    if(!demoHangup) return;
    $('hangup').disabled = true;
    const bye = 'Great work today, Amy! Your self-introduction was clear and fun to listen to. See you next time!';
    addBubble('assistant', bye);
    let done = false;
    const finish = () => {
      if(done) return; done = true;
      demoHangup = false; $('hangup').disabled = false;
      setCallUI('off'); setStatus('已下課'); peekMascot();
    };
    if(window.speechSynthesis){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(bye); u.lang = 'en-US';
      const v = pronVoice(); if(v) u.voice = v;
      u.onend = u.onerror = () => setTimeout(finish, 300);
      speechSynthesis.speak(u);
      setTimeout(finish, 12000);   // 保險：語音沒回報念完也會下課
    }else setTimeout(finish, 1500);
  };
  const L = lessons.find(x => x.id === DEMO_DATA.noteLesson);
  chatLesson = L || null;
  addBubble('sys', '展示版｜範例對話');
  chatDb.lesson(DEMO_DATA.noteLesson).then(lines => {
    for(const x of lines){
      if(x.role !== 'me'){
        const t = addBubble('assistant', x.text);
        if(x.meta) setMeta(t, x.meta);
        const m = /開口 ([\d.]+)/.exec(x.meta || ''); if(m) turns.push({start:Number(m[1]) * 1000});
        continue;
      }
      const b = addBubble('user', x.text), tx = b.querySelector('.txt');
      if(x.heard) markText(tx, x.heard, x.habits, settings.pronNotes ? x.pron : []);
      if(x.fix){ tx._sentence = x.fix; tx.after(el('span', 'fix', x.fix)); }
      if(x.wav) addPlayButton(b, {secs:x.secs || 0, url:x.wav});
    }
    renderStats();
    chatEl.scrollTop = 0;   // 從第一句開始看
  });
}
</script>
