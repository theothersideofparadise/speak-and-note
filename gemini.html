<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak & Note Gemini｜英文口說練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Turret+Road:wght@700;800&family=Sofia+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 設計變數：只能用 design/DESIGN.md 裡的（美化規則 2）。定案樣稿 design/mockups/final.html */
@font-face{font-family:'Glow Sans TC Condensed';src:url(fonts/GlowSansTC-Condensed-Regular.woff2) format('woff2');font-weight:400;font-display:fallback}
@font-face{font-family:'Glow Sans TC Condensed';src:url(fonts/GlowSansTC-Condensed-Bold.woff2) format('woff2');font-weight:700;font-display:fallback}
:root{
  /* 有意思的顏色（一個顏色只代表一件事） */
  --ink:#16252E; --muted:#465962;
  --user:#F2D2CD; --listen:#E3A69C; --listen-ink:#B5665B; --teacher:#BFDCEF;
  --mic:#34566A; --on-mic:#FFFFFF; --pause:#8953A1; --pause-hover:#74468A; --pause-active:#633B76;
  --fix:#A8355A; --pron:#B58200; --pron-strong:#966C00;
  /* 底色和線 */
  --chatbg:#FFFFFF; --nbbg:#F2FAFF; --practice-bg:#F1F5F8; --line:#B9BEC8;
  --scroll:#8698A2; --scroll-hover:#687C87;
  --hover:rgba(52,86,106,.08); --hover-soft:rgba(52,86,106,.05); --pron-hover:rgba(123,91,0,.12);
  --hairline:rgba(0,0,0,.14); --scrim:rgba(22,37,46,.5);
  /* 天空和背景圖（只給 banner 和頁面底色） */
  --sky1:#2F5B78; --sky-low:#7FAEC4; --land3:#F0DFDB; --on-sky:#F5F2F8;
  --on-sky-line:rgba(255,255,255,.5); --on-sky-fill:rgba(255,255,255,.16);
  --planet:#DDB3B6; --band:#C99AA6; --lit:#FFF8ED; --shade:#7890A6;
  --land1:#98CEE0; --land15:#96B2D5; --land2:#D3A6AA; --star:#FFFFFF; --orbit:#E9DCDD;
  /* 課堂整理日期顏色：灰藍 → 霧綠 → 灰粉，14 天一圈（DESIGN.md 月曆、日期顏色） */
  --date-a:#B9CCD9; --date-b:#BCD0C2; --date-c:#E0C3C8;
  /* 字 */
  --f-title:'Turret Road','Glow Sans TC Condensed','Noto Sans TC',sans-serif;
  --f-body:'Sofia Sans','Glow Sans TC Condensed','Noto Sans TC',sans-serif;
  --fs-xs:14px; --fs-sm:16px; --fs-md:18px; --fs-lg:24px; --fs-state:26px; --fs-xl:30px; --fs-xxl:38px;
  /* 間距 */
  --s1:2px; --s2:4px; --s3:6px; --s4:8px; --s5:10px; --s6:14px; --s7:18px; --pad:22px; --s8:26px;
  /* 圓角、陰影、動態 */
  --r0:2px; --r1:4px; --r2:6px; --r3:8px;
  --shadow-sheet:0 -3px 10px rgba(20,35,45,.16); --shadow-dialog:0 8px 30px rgba(20,35,45,.3);
  --ring-focus:inset 0 0 0 2px var(--ink);
  --t-hand:.25s ease-out; --t-content:.5s cubic-bezier(.2,.7,.2,1);
  /* 固定尺寸 */
  --bh:200px; --page-w:1120px; --mic-size:68px; --bar-h:99px; --hit:44px; --icon-btn:32px;
  --top-btn-h:40px; --strip-lab:58px; --sheet-h:62vh;
  color-scheme:light;
}
@media (max-width:700px){
  :root{--fs-md:17px; --fs-lg:22px; --fs-state:22px; --fs-xl:24px; --fs-xxl:20px; --pad:14px; --mic-size:58px; --bh:112px; --icon-btn:var(--hit)}
}
/* 未來熒黑沒載入：Noto 排版（DESIGN.md 2.1） */
:root.noglow{--f-body:'Sofia Sans','Noto Sans TC',sans-serif;--f-title:'Turret Road','Noto Sans TC',sans-serif}
.noglow .ghost,.noglow .call-text,.noglow .tag,.noglow .meaning,.noglow .hint,.noglow .note-status,.noglow .count,.noglow .send{letter-spacing:-.02em}
@media (max-width:420px){.noglow .top h1{font-size:var(--fs-xxl)}.noglow .top-actions button{padding:0 var(--s3)}}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:var(--fs-md);line-height:1.5;display:flex;flex-direction:column;overflow:hidden;position:relative;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky-low) calc(var(--bh) - 45px),var(--sky-low) var(--bh),var(--land3) var(--bh),var(--land3) 100%)}
button,textarea,input,select{font:inherit;color:inherit}
button,select{font-size:var(--fs-sm)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* 捲軸（DESIGN.md 8.6） */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);background-clip:padding-box;border:2px solid transparent;border-radius:var(--r1)}
::-webkit-scrollbar-thumb:hover{background-color:var(--scroll-hover)}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}}

/* ---- 天空 banner：第七輪天空之城＋吉祥物的頭（星球）。場景由 design/mockups/_gen27.py 產生，樣式都包在 .scene 裡 ---- */
.scene{position:absolute;left:0;top:0;width:100%;height:var(--bh);pointer-events:none;display:block}
.scene .sky{fill:url(#gSky)}
.scene .star{fill:var(--star)}
.scene .land1{fill:var(--land1)} .scene .land15{fill:var(--land15)} .scene .land2{fill:var(--land2)}
.scene .fL{fill:url(#gL)} .scene .fR{fill:url(#gR)} .scene .sRg{fill:url(#gRs)}
.scene .rL{fill:var(--sky1)} .scene .rR{fill:var(--band)} .scene .win{fill:var(--sky1);opacity:.7}
.scene .sL{fill:var(--land15)} .scene .sH{fill:var(--shade)} .scene .bU{fill:var(--shade)}
.scene .planetc{fill:var(--planet)} .scene .pat-planetc .pa{fill:var(--lit);opacity:.75}
.scene .pshadow{fill:var(--sky1);opacity:.25}
.scene .ew{fill:var(--lit)} .scene .ep{fill:var(--sky1)}
.scene .eyeP{transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
.scene .e0{--i:0} .scene .e1{--i:1} .scene .e2{--i:2} .scene .e3{--i:3} .scene .e4{--i:4} .scene .e5{--i:5} .scene .e6{--i:6}
/* 結束課堂：星球（吉祥物的頭）探頭睜眼，播一次（DECISIONS 第二十八輪之五＋之七）。
   以藏在坡地後的身體底部為軸往右擺出去，像在水裡慢慢停住；暗面（.counter）做相反的動作，所以畫面上不動，臉從陰影鑽出來。
   一擺出去就從右往左輪流睜眼，一睜開就閉上。 */
.scene.peek .tilt{animation:peek 8.6s}
.scene.peek .counter{animation:peek-counter 8.6s}
.scene.peek .eyeP{animation:peek-eye 8.6s ease-in-out;animation-delay:calc((6 - var(--i)) * .17s)}
@keyframes peek{
  0%,8%{transform:translate(0,0) rotate(0);animation-timing-function:cubic-bezier(.3,.7,.4,1)}
  17%{transform:translate(14.5px,-18px) rotate(21.5deg);animation-timing-function:cubic-bezier(.4,0,.4,1)}
  24%,48%{transform:translate(14px,-17px) rotate(20deg);animation-timing-function:cubic-bezier(.45,0,.35,1)}
  64%,100%{transform:translate(0,0) rotate(0)}}
@keyframes peek-counter{
  0%,8%{transform:rotate(0) translate(0,0);animation-timing-function:cubic-bezier(.3,.7,.4,1)}
  17%{transform:rotate(-21.5deg) translate(-14.5px,18px);animation-timing-function:cubic-bezier(.4,0,.4,1)}
  24%,48%{transform:rotate(-20deg) translate(-14px,17px);animation-timing-function:cubic-bezier(.45,0,.35,1)}
  64%,100%{transform:rotate(0) translate(0,0)}}
@keyframes peek-eye{0%,9%{transform:scaleY(0)}13%,16.5%{transform:scaleY(1)}21%,100%{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.scene.peek .tilt,.scene.peek .counter,.scene.peek .eyeP{animation:none}}
/* 開場動畫 A「沉下去，再浮上來」（DECISIONS 第二十九輪）。<html class="intro"> 時才播，播完或點一下／按任一鍵就拿掉。
   0–0.8 秒：吉祥物近景全身、腳輕輕動，後面的塔模糊、低彩度。0.8–1.6：吉祥物像在水裡往下沉出畫面，塔變清楚。
   1.4–2.6：鏡頭拉遠（場景框從整頁縮成 banner；SVG 是 xMidYMax slice，框變矮＝拉遠），坡地升上來，左右小建築、遠方地平線淡入，彩度恢復。
   2.2–3.0：星球從塔群後面升起（和沉下去同一條曲線倒過來：它就是吉祥物的頭）。2.8–3.4：頂端和兩欄往上浮出來。 */
.pod-wrap{display:none}
.pod-wrap svg{display:block;width:100%;height:100%}
.pod-wrap .leg2,.pod-wrap .bodyc{fill:var(--sky1)}
.pod-wrap .pat-bodyc .pa{fill:var(--shade)}
.intro .pod-wrap{display:block;position:absolute;left:50%;bottom:16%;height:46%;aspect-ratio:116/124;pointer-events:none;animation:intro-sink .8s cubic-bezier(.8,0,.8,.3) .8s both}
.intro .pod-wrap .leg2{transform-box:fill-box;transform-origin:top center;animation:intro-wig 1.6s ease-in-out infinite}
.intro .pod-wrap .leg2:nth-child(even){animation-delay:-.8s}
.intro .scene{animation:intro-zoom 1.2s ease-in-out 1.4s both,intro-unblur 1.8s ease-out .8s both}
.intro .scene .l-ground{animation:intro-ground 1.2s ease-out 1.4s both}
.intro .scene .l-base,.intro .scene .l-far{animation:intro-fade 1s ease-out 1.6s both}
.intro .scene .l-planet{animation:intro-planet .8s cubic-bezier(.2,.7,.2,1) 2.2s both}
.intro .top{animation:intro-up .5s cubic-bezier(.2,.7,.2,1) 2.8s both}
.intro .layout{animation:intro-up .5s cubic-bezier(.2,.7,.2,1) 2.9s both}
@keyframes intro-sink{from{transform:translate(-50%,0)}99%{opacity:1;transform:translate(-50%,130%)}to{opacity:0;transform:translate(-50%,130%)}}
@keyframes intro-wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes intro-zoom{from{top:0;height:100%}}   /* 沒寫 to＝收到 banner 平常的位置和高度（手機的 banner 在標題列下面） */
@keyframes intro-unblur{0%{filter:blur(3px) saturate(.3)}33%{filter:blur(0) saturate(.3)}100%{filter:none}}
@keyframes intro-ground{from{transform:translateY(60px)}to{transform:none}}
@keyframes intro-fade{from{opacity:0}to{opacity:1}}
@keyframes intro-planet{from{transform:translateY(260px)}to{transform:none}}
@keyframes intro-up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@media (max-width:700px){.intro .pod-wrap{height:32%;bottom:24%}}
.scene .st-sky1{stop-color:var(--sky1)} .scene .st-skylow{stop-color:var(--sky-low)} .scene .st-lit{stop-color:var(--lit)}
.scene .st-orbit{stop-color:var(--orbit)} .scene .st-planet{stop-color:var(--planet)} .scene .st-band{stop-color:var(--band)}
.scene .st-land15{stop-color:var(--land15)} .scene .st-shade{stop-color:var(--shade)}

/* ---- 頂端：標題和三顆按鈕，左右對齊內容線 ---- */
.top{position:relative;flex:none;width:100%;max-width:var(--page-w);height:var(--bh);margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);padding:var(--s7) var(--pad) 0}
.top h1{margin:0;font:800 var(--fs-xxl)/1 var(--f-title);letter-spacing:.02em;color:var(--on-sky);white-space:nowrap}
.top-actions{display:flex;gap:var(--s4);flex:none}
.top-actions button{background:none;border:1px solid var(--on-sky-line);color:var(--on-sky);border-radius:var(--r1);padding:var(--s3) var(--s6);font-size:var(--fs-sm);white-space:nowrap}
.top-actions button.main{background:var(--on-sky-fill)}
.top-actions button:hover{background:var(--on-sky-fill)}
.top-actions button:focus-visible{outline:2px solid var(--on-sky);outline-offset:2px;box-shadow:none}
.mode{color:var(--ink)}

/* ---- 兩欄 ---- */
.layout{position:relative;flex:1;min-height:0;width:100%;max-width:var(--page-w);margin:0 auto var(--s8);display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);column-gap:var(--s7)}
.chat-col,.note-col{min-height:0;display:flex;flex-direction:column;border-radius:var(--r2);overflow:hidden}
.chat-col{background:var(--chatbg)}
.chat-head{flex:none;padding:var(--s7) var(--pad) var(--s5);background:var(--chatbg)}
.chat-head h2{margin:0;font:700 var(--fs-xl)/1 var(--f-title)}

/* ---- 聊天泡泡 ---- */
.chat{flex:1;min-height:0;overflow-y:auto;padding:var(--s2) var(--pad) var(--pad);display:flex;flex-direction:column;gap:var(--s6);background:var(--chatbg)}
.chat > :first-child{margin-top:auto}
.msg{max-width:78%;padding:var(--s5) var(--s6);border-radius:var(--r2);white-space:pre-wrap;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:flex-start}
.msg > *{max-width:100%}
.msg.teacher{align-self:flex-start;background:var(--teacher)}
.msg.me{align-self:flex-end;background:var(--user)}
.msg.pending .txt{color:var(--muted);font-style:italic}
.msg .meta{display:block;margin-top:var(--s2);font-size:var(--fs-xs);color:var(--muted);white-space:normal}
.msg.sys{align-self:center;display:block;background:none;color:var(--muted);font-size:var(--fs-xs);padding:var(--s1) var(--s4)}
/* 老師回想／上網查：細線圖示＋一行小字，等待時圖示一明一暗 */
.msg.sys.tool{display:flex;flex-direction:row;align-items:center;gap:var(--s2)}
.msg.sys.tool .ico{flex:none;width:1.25em;height:1.25em}
.msg.sys.tool.pending .txt{font-style:normal}
.msg.sys.tool.pending .ico{animation:tool-wait 1.2s ease-in-out infinite alternate}
.msg.sys.tool.failed{color:var(--ink)}
@keyframes tool-wait{from{opacity:1}to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.msg.sys.tool.pending .ico{animation:none}}
.msg .fix{display:block;color:var(--muted);margin-top:var(--s2)}
body.nofix .msg .fix{display:none}
.msg .play{border:none;background:none;padding:0;font:inherit;color:var(--muted);cursor:pointer}
.msg .meta-t:not(:empty) + .play::before{content:'·';margin:0 var(--s3)}
.msg .play:hover{color:var(--ink)}
.msg .play:focus-visible{outline:none;box-shadow:var(--ring-focus);border-radius:var(--r0)}
.hab-add{color:var(--fix);font-weight:700}
.hab-del{color:var(--fix);text-decoration:line-through}
.pron-mark{color:var(--pron);font-weight:700;border-radius:var(--r0);padding:0 var(--s1)}
.pron-mark:hover{background:var(--pron-hover)}
.note.pron-note{cursor:pointer}
.msg.me .pron-mark{cursor:pointer}

/* ---- 麥克風列 ---- */
.composer{flex:none;border-top:1px solid var(--line);padding:var(--s6) var(--pad) var(--s7);background:var(--nbbg);min-height:var(--bar-h);display:flex;flex-direction:column;justify-content:center}
.composer-row{display:flex;gap:var(--s7);align-items:center}
.call-text{flex:1;min-width:0}
.call-text b{display:block;font:600 var(--fs-state)/1.15 var(--f-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer-row .ghost{flex:none;white-space:nowrap}
.stats{font-size:var(--fs-xs);color:var(--muted);text-align:right}
.stats[hidden]{display:none}

/* ---- 筆記本 ---- */
.note-col{background:var(--nbbg)}
.nb-toggle{position:absolute;opacity:0;pointer-events:none}
.note-head{flex:none;display:flex;flex-direction:row;align-items:baseline;gap:var(--s5);padding:var(--s7) var(--pad) var(--s5);font-size:var(--fs-md)}
.note-head h2{margin:0;font:700 var(--fs-xl)/1 var(--f-title)}
.note-head .chev{display:none}
.count{font-size:var(--fs-xs);color:var(--muted)}
.note-status{padding:0 var(--pad) var(--s5);font-size:var(--fs-xs);color:var(--muted)}
.note-status:empty{display:none}
.note-status.error{color:var(--ink);font-weight:700}
.notes{flex:1;min-height:0;overflow-y:auto;margin:0 var(--pad);border-left:2px solid var(--line)}
.empty{color:var(--muted);font-size:var(--fs-sm);padding:var(--s5) 0 0 var(--s6);margin:0}
.note{display:flex;flex-direction:column;padding:var(--s5) 0 var(--s6) var(--s6);border-bottom:1px solid var(--line)}
.note.fresh{animation:land .9s ease-out}
@keyframes land{from{background:var(--hover)}to{background:transparent}}
.line{margin:0}
.mark{display:none}
.wrong{color:var(--muted)}
.correct{color:var(--fix);font-weight:700}
.said{color:var(--muted)}
.meaning{margin:var(--s1) 0 0;color:var(--muted);font-size:var(--fs-xs)}
.tag{order:-1;display:block;margin:0 0 var(--s1);font-size:var(--fs-xs);font-weight:700;color:var(--muted)}
.note.pron-note:hover{background:var(--hover-soft)}
.note.pron-note .correct{color:var(--pron)}
.note.pron-note .said{color:var(--ink)}
.note-actions{flex:none;display:flex;justify-content:space-between;align-items:center;gap:var(--s4);padding:var(--s6) var(--pad);min-height:var(--bar-h)}

/* ---- 發音練習小窗（新排法是功能那一輪，PENDING 1–9；這裡只換顏色） ---- */
.pron-box{display:block;margin:var(--s5) 0 var(--s1);padding:var(--s6) var(--s6) var(--s5);border-radius:var(--r2);background:var(--practice-bg);color:var(--ink);white-space:normal;cursor:default;font-size:var(--fs-sm)}
.pron-box .pb-chat{display:flex;flex-direction:column;gap:var(--s4);margin:0 0 var(--s6);max-height:40vh;overflow:auto}
.pron-box .pb-chat:empty{display:none}
.pron-box .pb-msg{align-self:flex-start;max-width:92%;padding:var(--s3) var(--s5);border-radius:var(--r2);background:var(--teacher);line-height:1.45}
.pron-box .pb-msg.coach.good{box-shadow:var(--ring-focus)}
.pron-box .pb-msg.me{align-self:flex-end;background:var(--user)}
.pron-box .pb-msg .again{border:none;background:none;padding:0 0 0 var(--s4);font-size:var(--fs-xs);color:var(--muted)}
.pron-box .pb-msg .again:hover{color:var(--ink)}
.pron-box .pb-zh{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:var(--s1)}
.pron-box .pb-row{display:flex;justify-content:center}
.pron-box .pb-status{margin:var(--s4) 0 0;font-size:var(--fs-xs);color:var(--ink);text-align:center}
.pron-box .pb-status:empty{display:none}
.say{display:grid;place-items:center;width:var(--hit);height:var(--hit);padding:0;border:none;border-radius:50%;background:var(--mic);color:var(--on-mic)}
.say svg{width:22px;height:22px}
.say.rec{box-shadow:0 0 0 4px var(--listen)}
.say:disabled{opacity:.45;cursor:default}
.say:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---- 按鈕只有三種（DESIGN.md 8.1）：主要＝.mic（墨色實心圓）、次要＝.ghost（細框）、文字＝.ghost.danger（底線小字，危險動作用） ---- */
.ghost{background:transparent;border:1px solid var(--line);border-radius:var(--r1);padding:var(--s3) var(--s6);font-size:var(--fs-sm);line-height:1.5;color:var(--ink)}
.ghost:hover{background:var(--hover)}
.ghost:active{background:var(--hover);border-color:var(--muted)}
.ghost:disabled{opacity:.45;cursor:default;background:transparent}
.ghost:focus-visible,.send:focus-visible,.dlg-head .x:focus-visible{outline:none;box-shadow:var(--ring-focus)}
.ghost.danger{border-color:transparent;background:none;padding:var(--s3) 0;font-size:var(--fs-xs);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.ghost.danger:hover,.ghost.danger:active{color:var(--ink);background:none;border-color:transparent}
.mic{flex:none;width:var(--mic-size);height:var(--mic-size);border-radius:50%;border:none;background:var(--mic);color:var(--on-mic);display:grid;place-items:center;position:relative}
.mic svg{width:28px;height:28px}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--listen);animation:pulse 1.4s ease-out infinite}
.mic.hearing::after{animation-duration:.6s}
.mic:disabled{opacity:.45;cursor:not-allowed}
.mic:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* 暫停中：紫色（程式本來就會加 paused；圖示換成播放鍵是功能那一輪，PENDING S2） */
.mic.paused{background:var(--pause)}
.mic.paused:hover{background:var(--pause-hover)}
.mic.paused:active{background:var(--pause-active)}
@keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
.send{border:none;border-radius:var(--r1);padding:var(--s4) var(--s7);background:var(--mic);color:var(--on-mic);font-weight:700}
.dlg-head .x{flex:none;display:grid;place-items:center;width:var(--icon-btn);height:var(--icon-btn);padding:0;border:1px solid var(--line);border-radius:var(--r1);background:none;color:var(--ink)}
.dlg-head .x:hover{background:var(--hover)}

/* ---- 彈窗（課堂整理、設定） ---- */
dialog{border:none;border-radius:var(--r2);padding:0;background:var(--nbbg);color:var(--ink);width:min(460px,92vw);box-shadow:var(--shadow-dialog)}
#lessons{width:min(720px,94vw)}
dialog::backdrop{background:var(--scrim)}
dialog form{padding:var(--s7) var(--pad);display:flex;flex-direction:column;gap:var(--s6);max-height:88vh;overflow-y:auto}
dialog h2{margin:0;font-size:var(--fs-lg)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s6)}
/* 課堂整理：標題列和 × 捲動時固定在最上面（背景蓋住捲上去的內容） */
#lessons .dlg-head{position:sticky;top:calc(var(--s7) * -1);z-index:1;background:var(--nbbg);margin:calc(var(--s7) * -1) calc(var(--pad) * -1) calc(var(--s4) * -1);padding:var(--s7) var(--pad) var(--s4)}
label{display:flex;flex-direction:column;gap:var(--s2);font-size:var(--fs-sm)}
input[type=text],input[type=password],select,textarea{border:1px solid var(--line);border-radius:var(--r1);padding:var(--s4) var(--s5);background:var(--chatbg);font-size:var(--fs-sm)}
input[type=range],input[type=checkbox]{accent-color:var(--mic)}
.hint{font-size:var(--fs-xs);color:var(--muted)}
p.hint{margin:0}
.dialog-actions{display:flex;justify-content:flex-end;gap:var(--s4);flex-wrap:wrap}
.dialog-actions .danger{margin-right:auto}
label.check{flex-direction:row;align-items:center;gap:var(--s4)}
label[hidden]{display:none}
details.log{border-top:1px solid var(--line);padding:var(--s4) 0 0;font-size:var(--fs-xs);color:var(--muted)}
details.log pre{max-height:180px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:var(--s3) 0 0}
#fixedRules{white-space:pre-wrap;font-size:var(--fs-xs);max-height:240px;overflow:auto}

/* 課堂整理：目錄 */
#lessonList > h3{margin:var(--s7) 0 var(--s2);font-size:var(--fs-xs);font-weight:700;color:var(--muted)}
.lesson-row{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:var(--s5) var(--s3);font-size:var(--fs-md)}
.lesson-row b{font-weight:700}
.lesson-row:hover{background:var(--hover)}
/* 課堂整理：內頁 */
/* ---- 課堂整理目錄：小月曆＋時間線（DECISIONS 第七、十二、十四輪；DESIGN.md 月曆、日期顏色、時間線） ---- */
.dc0{--c:var(--date-a)} .dc1{--c:color-mix(in srgb,var(--date-a) 78.6%,var(--date-b))} .dc2{--c:color-mix(in srgb,var(--date-a) 57.1%,var(--date-b))} .dc3{--c:color-mix(in srgb,var(--date-a) 35.7%,var(--date-b))} .dc4{--c:color-mix(in srgb,var(--date-a) 14.3%,var(--date-b))} .dc5{--c:color-mix(in srgb,var(--date-b) 92.9%,var(--date-c))} .dc6{--c:color-mix(in srgb,var(--date-b) 71.4%,var(--date-c))} .dc7{--c:color-mix(in srgb,var(--date-b) 50%,var(--date-c))} .dc8{--c:color-mix(in srgb,var(--date-b) 28.6%,var(--date-c))} .dc9{--c:color-mix(in srgb,var(--date-b) 7.1%,var(--date-c))} .dc10{--c:color-mix(in srgb,var(--date-c) 85.7%,var(--date-a))} .dc11{--c:color-mix(in srgb,var(--date-c) 64.3%,var(--date-a))} .dc12{--c:color-mix(in srgb,var(--date-c) 42.9%,var(--date-a))} .dc13{--c:color-mix(in srgb,var(--date-c) 21.4%,var(--date-a))}
.cal{padding-bottom:var(--s6);border-bottom:1px solid var(--line)}
.cal-head{display:flex;align-items:center;gap:var(--s5);margin-bottom:var(--s4)}
.cal-head b{font-size:var(--fs-md);white-space:nowrap}
.cal-head .hint{margin:0 0 0 auto}
.cal-head .icon{flex:none;display:inline-grid;place-items:center;width:calc(var(--icon-btn) + var(--s2));height:calc(var(--icon-btn) + var(--s2));padding:0;border:none;border-radius:var(--r1);background:none;color:var(--mic)}
.cal-head .icon svg{width:var(--s7);height:var(--s7)}
.cal-head .icon:not(:disabled):hover{background:var(--hover)}
.cal-head .icon:disabled{opacity:.35;cursor:default}
.cal.closed .cal-grid{display:none}
.cal.closed .calfold svg{transform:rotate(180deg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s2);text-align:center}
.cal-grid .wd{font-size:var(--fs-xs);color:var(--muted);padding-bottom:var(--s1)}
.cal-grid .d{border:none;border-radius:var(--r1);background:none;font-size:var(--fs-sm);line-height:1.2;color:var(--muted);padding:var(--s3) 0 var(--s2);display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.cal-grid .d:disabled{cursor:default}
.cal-grid .d.has{background:var(--c);color:var(--ink);font-weight:700}
.cal-grid .d.has:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.cal-grid .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.dots{display:flex;gap:var(--s1);height:var(--s2)}
.dots i{width:var(--s2);height:var(--s2);border-radius:50%;background:var(--ink);opacity:.55}
#lessonList .month{margin:var(--s7) 0 var(--s1);font-size:var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.04em;scroll-margin-top:var(--bar-h)}
.day{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s6);padding:var(--s5) 0;border-bottom:1px solid var(--line);scroll-margin-top:var(--bar-h)}
.dt{align-self:start;width:calc(var(--hit) + var(--s6));aspect-ratio:1;border-radius:var(--r1);background:var(--c);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dt b{font:700 var(--fs-lg)/1 var(--f-body)}
.dt span{font-size:var(--fs-xs);margin-top:var(--s1)}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s5);width:100%;text-align:left;background:none;border:none;padding:var(--s3) var(--s2);border-radius:var(--r1)}
.lrow + .lrow{border-top:1px dashed var(--line)}
.lrow:hover{background:var(--hover)}
.lrow time{font-size:var(--fs-xs);color:var(--muted)}
.lrow b{display:block;font-size:var(--fs-md);font-weight:700}
.lrow small{font-size:var(--fs-xs);color:var(--muted)}
.lrow .go{width:var(--s7);height:var(--s7);color:var(--muted)}
.back svg{width:var(--s6);height:var(--s6);vertical-align:-2px;margin-right:var(--s1)}
@media (max-width:700px){
  .cal-head{flex-wrap:wrap;gap:var(--s4)}
  .cal-head .hint{order:9;flex-basis:100%;margin:0}
  .cal-head .calfold{margin-left:auto}
  .day{gap:var(--s5)}
  .lrow{column-gap:0;row-gap:var(--s1);padding:var(--s4) var(--s1)}
  .lrow > span{display:contents}
  .lrow b{grid-row:1;grid-column:1 / span 2}
  .lrow time{grid-row:2;grid-column:1}
  .lrow time::after{content:'｜'}
  .lrow small{grid-row:2;grid-column:2}
  .lrow .go{grid-row:1 / span 2;grid-column:3;margin-left:var(--s4)}
}
/* 習慣清單：名稱、細進度條、成績；手機上名稱和成績同一行，進度條在下一行拉滿（DESIGN.md 進度條：細條、--r0、底色 --line、已完成 --mic） */
.habit{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 9em;align-items:center;gap:var(--s6);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.habit b{font-weight:700}
.habit span{font-size:var(--fs-xs);color:var(--muted);text-align:right}   /* 成績欄固定寬、靠右：三條進度條一樣長 */
.bar{-webkit-appearance:none;appearance:none;display:block;width:100%;height:var(--s3);border:none;border-radius:var(--r0);background:var(--line);overflow:hidden}
.bar::-webkit-progress-bar{background:var(--line);border-radius:var(--r0)}
.bar::-webkit-progress-value{background:var(--mic);border-radius:var(--r0)}
.bar::-moz-progress-bar{background:var(--mic);border-radius:var(--r0)}
@media (max-width:700px){
  .habit{grid-template-columns:minmax(0,1fr) auto;row-gap:var(--s3);column-gap:var(--s5)}
  .habit .bar{grid-column:1 / -1;grid-row:2}
}
.lesson{padding:var(--s5) 0 0}
.lesson > h3:first-child{margin:var(--s5) 0 var(--s1);padding:0;border:none;font-size:var(--fs-lg)}
.lesson h3{margin:var(--pad) 0 var(--s4);padding-bottom:var(--s3);border-bottom:1px solid var(--line);font-size:var(--fs-md)}
.lesson > p{margin:var(--s2) 0}
.lesson .grp{margin:var(--s4) 0 var(--s6)}
.lesson .grp .line b{font-weight:700}
.chat.record{flex:none;overflow:visible;padding:var(--s2) var(--s6) var(--s4);border-radius:var(--r2)}
.chat.record > :first-child{margin-top:0}
.lesson-acts{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) 0 0}
.lesson-acts .danger{margin-left:auto}

/* ---- 手機（700px 以下） ---- */
@media (max-width:700px){
  .scene{top:44px;height:68px}
  .top{padding:var(--s5) var(--pad) 0}
  .top-actions{gap:var(--s3)}
  .top-actions button{min-height:var(--top-btn-h);padding:0 var(--s4);font-size:var(--fs-xs)}
  .layout{margin:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto}
  .chat-col{display:contents}
  .chat-head{grid-row:1;padding:var(--s5) var(--pad) var(--s3)}
  .chat{grid-row:2;gap:var(--s5);padding-top:var(--s2)}
  .msg{max-width:88%}
  .composer{grid-row:4;min-height:0;padding:var(--s5) var(--pad) calc(var(--s6) + env(safe-area-inset-bottom))}
  .composer-row{gap:var(--s6)}
  /* 筆記本收起：一條「N 則＋最新一則＋^」，點一下展開 */
  .note-col{grid-row:3;position:relative;border-radius:var(--r3) var(--r3) 0 0;box-shadow:var(--shadow-sheet);margin-top:calc(-1 * var(--s4))}
  .note-head{min-height:64px;align-items:center;gap:var(--s6);padding:var(--s4) var(--pad);cursor:pointer;user-select:none}
  .note-head h2{display:none}
  .note-head .count{width:var(--strip-lab);flex:none;text-align:center;font:700 var(--fs-md)/1.2 var(--f-body);color:var(--ink)}
  .note-head .chev{display:block;margin-left:auto;flex:none;color:var(--ink)}
  .nb-toggle:focus-visible + .note-head{box-shadow:var(--ring-focus)}
  .note-status,.note-actions{display:none}
  .notes{display:none}
  .note-head{touch-action:none}
  .strip-latest{display:block;flex:1;min-width:0;overflow:hidden;transition:height var(--t-content)}
  .strip-latest .roll{display:flex;flex-direction:column}
  .strip-latest .roll.go{transition:transform var(--t-content)}
  .strip-latest .sl{display:block}
  .strip-latest p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-sm);line-height:1.35}
  .strip-latest .meaning{font-size:var(--fs-xs)}
  .nb-toggle:checked + .note-head .strip-latest{display:none}
  .wide{display:none}
  /* 筆記本展開：蓋住下方約六成，聊天擠扁、天空收起 */
  .layout:has(.nb-toggle:checked){grid-template-rows:0 minmax(0,1fr) var(--sheet-drag,var(--sheet-h)) auto}
  body:has(.nb-toggle:checked) .scene,.layout:has(.nb-toggle:checked) .chat-head{display:none}
  body:has(.nb-toggle:checked) .top{height:auto;padding-bottom:var(--s5)}
  body:has(.nb-toggle:checked) .chat{padding-top:var(--pad)}
  .note-col:has(.nb-toggle:checked){display:flex;flex-direction:column}
  .nb-toggle:checked + .note-head{border-bottom:1px solid var(--line)}
  .nb-toggle:checked + .note-head h2{display:block}
  .nb-toggle:checked + .note-head .count{width:auto;font:400 var(--fs-xs) var(--f-body);color:var(--muted)}
  .nb-toggle:checked + .note-head .chev{transform:rotate(180deg)}
  .note-col:has(.nb-toggle:checked) .note-status{display:block;padding-top:var(--s5)}
  .note-col:has(.nb-toggle:checked) .note-actions{display:flex;min-height:0;padding:var(--s5) var(--pad);border-top:1px solid var(--line)}
  .note-col:has(.nb-toggle:checked) .notes{flex:1;min-height:0;display:block}
  /* 課堂整理在手機整頁蓋滿 */
  dialog,#lessons{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  dialog form{max-height:100dvh;padding-bottom:calc(var(--s7) + env(safe-area-inset-bottom))}
}
@media (max-width:380px){.top h1{font-size:var(--fs-xxl)}.top-actions button{padding:0 var(--s3)}}

/* 清空對話：存好的那堂課縮小飛進「課堂整理」按鈕 */
.chat-ghost{position:fixed;margin:0;overflow:hidden;pointer-events:none;z-index:50;background:var(--chatbg);border-radius:var(--r2);box-shadow:var(--shadow-dialog);transform-origin:top left}
@keyframes lesson-got{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.got-lesson{animation:lesson-got .35s ease-out;border-color:var(--on-sky);color:var(--on-sky)}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .mic.on::after{opacity:.6}
}

/* ==== 功能那一輪（2026-11-18）：麥克風跟著狀態換圖示、音量條、說話方式晶片、錯誤卡片、筆記只劃錯字、手機筆記條、發音練習 ==== */
.mic.on{box-shadow:0 0 0 4px var(--listen)}
.mic.on::after{content:none}
.mic .spin-ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bars{display:inline-flex;align-items:flex-end;gap:var(--s1);height:var(--s7);margin-right:var(--s4)}
.bars i{display:block;width:var(--s2);height:100%;background:var(--mic);border-radius:var(--r0);transform-origin:bottom;--b:.35;transform:scaleY(calc(var(--b) + var(--lv,0) * (1 - var(--b))));transition:transform .08s linear}
.bars i:nth-child(2){--b:.6}.bars i:nth-child(3){--b:.45}.bars i:nth-child(4){--b:.25}
.bars.me i{background:var(--listen-ink)}
/* 說話方式晶片：只在「開始上課」和「暫停中」出現 */
.call-box{flex:1;min-width:0;position:relative}
.chip{display:inline-flex;align-items:center;gap:var(--s1);margin-top:var(--s2);padding:0 var(--s2) 0 var(--s4);border:1px solid var(--line);border-radius:var(--r1);background:none;font-size:var(--fs-xs);line-height:1.6;color:var(--muted)}
.chip:hover{background:var(--hover);color:var(--ink)}
.chip svg{width:1em;height:1em}
.chip[hidden]{display:none}
.chip:focus-visible{outline:none;box-shadow:var(--ring-focus)}
.mode-menu{position:absolute;left:0;bottom:calc(100% + var(--s4));z-index:20;display:flex;flex-direction:column;width:max-content;max-width:86vw;padding:var(--s2);background:var(--chatbg);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow-dialog)}
.mode-menu[hidden]{display:none}
.mode-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);text-align:left;background:none;border:none;border-radius:var(--r1);padding:var(--s4) var(--s5)}
.mode-menu button:hover{background:var(--hover)}
.mode-menu button:focus-visible{outline:none;box-shadow:var(--ring-focus)}
.mode-menu b{font-size:var(--fs-sm)}
.mode-menu button[aria-checked=true] b::after{content:"　✓"}
.mode-menu span{font-size:var(--fs-xs);color:var(--muted);white-space:normal}
/* 錯誤卡片：對話欄最上面，墨色細框＋驚嘆號（DESIGN.md 8.3） */
.err-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s5);align-items:center;margin-top:var(--s5);padding:var(--s5) var(--s6);border:1px solid var(--ink);border-radius:var(--r2);background:var(--chatbg)}
.err-card[hidden]{display:none}
.err-ico{width:1.25em;height:1.25em;fill:var(--ink)}
.err-hole{fill:var(--chatbg)}
.err-card b{display:block;font-size:var(--fs-md)}
.err-card p{margin:0;font-size:var(--fs-xs);color:var(--muted)}
.err-acts{display:flex;align-items:center;gap:var(--s4)}
.err-card .x{display:grid;place-items:center;width:var(--icon-btn);height:var(--icon-btn);padding:0;border:none;border-radius:var(--r1);background:none;color:var(--ink)}
.err-card .x:hover{background:var(--hover)}
.err-card .x svg{width:18px;height:18px}
/* 筆記員在忙：轉圈圖示 */
.note-status.busy::before{content:"";display:inline-block;width:.9em;height:.9em;margin-right:var(--s3);vertical-align:-.1em;border:2px solid var(--line);border-top-color:var(--mic);border-radius:50%;animation:spin 1s linear infinite}
/* 筆記只劃錯的字：刪掉的字劃玫瑰色線、改的字玫瑰色粗體 */
.line del{color:inherit;text-decoration-color:var(--fix);text-decoration-thickness:2px}
.line .add{color:var(--fix);font-weight:700}
@media (min-width:701px){.strip-latest{display:none}}
.strip-latest .pron-word{color:var(--pron);font-weight:700}
/* 筆記數字：新筆記時變的那一位往上捲 */
.count .num{display:inline-block;white-space:nowrap}
.count .dg{display:inline-block;height:1.2em;line-height:1.2;overflow:hidden;vertical-align:bottom}
.count .dg > span{display:block;height:1.2em}
.count .dg.roll2 > span{transition:transform var(--t-content)}
.count .dg.go > span{transform:translateY(-100%)}
.count .ze{margin-left:var(--s1)}
/* 發音提醒：右上 ⌄／^ 收合鈕和「發音」標籤頂端對齊；展開後大字＋念／慢速 */
.note.pron-note{position:relative;padding-right:calc(var(--icon-btn) + var(--s4))}
.note.pron-note.open{cursor:default}
.note.pron-note.open:hover{background:none}
.note.pron-note.open .pron-box{margin-right:calc(-1 * (var(--icon-btn) + var(--s4)))}
.fold{position:absolute;top:var(--s5);right:0;display:grid;place-items:center;width:var(--icon-btn);height:var(--icon-btn);padding:0;border:1px solid var(--line);border-radius:var(--r1);background:none;color:var(--mic)}
.fold:hover{background:var(--hover)}
.fold svg{width:18px;height:18px}
.hw{display:flex;align-items:center;gap:var(--s4);margin:var(--s1) 0 var(--s3)}
.pw{border:none;background:none;padding:0 var(--s1);margin-right:var(--s3);border-radius:var(--r0);font:700 var(--fs-state)/1.2 var(--f-body);color:var(--pron)}
.pw:hover{background:var(--pron-hover)}
.spk{display:inline-grid;place-items:center;width:var(--icon-btn);height:var(--icon-btn);padding:0;border:1px solid var(--line);border-radius:var(--r1);background:none;color:var(--mic)}
.spk:hover{background:var(--hover)}
.spk svg{width:18px;height:18px}
.heard{margin:0;font-size:var(--fs-sm)}
.heard b{font-weight:700}
.note.pron-note .correct.pw-inline{border-radius:var(--r0);padding:0 var(--s1);margin-left:calc(-1 * var(--s1))}
.note.pron-note .correct.pw-inline:hover{background:var(--pron-hover)}
@media (prefers-reduced-motion:reduce){
  .mic .spin-ico,.note-status.busy::before{animation-duration:3s}
  .bars i,.count .dg.roll2 > span,.strip-latest,.strip-latest .roll.go{transition:none}
}
@media (max-width:700px){

<header class="top">
  <h1>Speak & Note</h1>
  <div class="top-actions">
    <button id="openLessons" class="ghost main">課堂整理</button>
    <button id="newChat" class="ghost">新對話</button>
    <button id="openSettings" class="ghost">設定</button>
  </div>
</header>

<main class="layout">
  <section class="chat-col" aria-label="對話">
    <div class="chat-head"><h2>Conversation</h2>
      <div id="errCard" class="err-card" role="alert" hidden>
        <svg class="err-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><rect class="err-hole" x="11" y="6.5" width="2" height="7"/><rect class="err-hole" x="11" y="15.5" width="2" height="2"/></svg>
        <div><b id="errTitle"></b><p id="errText"></p></div>
        <div class="err-acts"><button id="errSettings" class="ghost" type="button" hidden>打開設定</button><button id="errClose" class="x" type="button" aria-label="關閉" title="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
      </div>
    </div>
    <div id="chat" class="chat" aria-live="polite"></div>
    <div class="composer">
      <div class="composer-row">
        <button id="call" class="mic" aria-label="開始通話" title="開始通話">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
        <div class="call-box">
          <div class="call-text" id="callText"><b>開始上課</b></div>
          <button id="modeChip" class="chip" type="button" aria-haspopup="true" aria-expanded="false" title="換說話方式"><span id="modeChipText"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
          <div id="modeMenu" class="mode-menu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-mode="ptt"><b>按一下說</b><span>按一下開始，再按一下送出</span></button>
            <button type="button" role="menuitemradio" data-mode="auto"><b>耐心自動</b><span>停約 2 秒才接</span></button>
            <button type="button" role="menuitemradio" data-mode="fast"><b>一般自動</b><span>停一下就接，最快</span></button>
          </div>
        </div>
        <button id="cancelTalk" class="ghost" hidden title="不送出這句（Esc）">取消<span class="wide">這句</span></button>
        <button id="hangup" class="ghost" hidden>結束課堂</button>
        <div class="stats" id="stats" hidden></div>
      </div>
    </div>
  </section>

  <aside class="note-col" aria-label="筆記本">
    <input type="checkbox" id="nbOpen" class="nb-toggle" aria-label="展開筆記本">
    <label class="note-head" for="nbOpen"><h2>My notebook</h2><span id="noteCount" class="count"></span><span id="stripLatest" class="strip-latest" aria-hidden="true"></span><svg class="chev" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></label>
    <div id="noteStatus" class="note-status" role="status"></div>
    <div id="notes" class="notes"></div>
    <div class="note-actions">
      <button id="exportNotes" class="ghost">匯出筆記</button>
      <button id="clearNotes" class="ghost danger">清空筆記</button>
    </div>
  </aside>
</main>

<dialog id="lessons">
  <form method="dialog">
    <div class="dlg-head"><h2>課堂整理</h2><button value="close" class="x" aria-label="關閉" title="關閉"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
        <div id="lessonList"></div>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog">
    <h2>設定</h2>
    <p class="hint">目前使用的模型：<span id="modeLabel" class="mode"></span></p>
    <label>Google AI Studio 金鑰
      <input type="password" id="googleKey" autocomplete="off" placeholder="AIza...">
      <span class="hint">只存在這個瀏覽器。錄影時別打開這頁。</span>
      <span><button type="button" class="ghost" id="testKey">測試金鑰</button> <span class="hint" id="testKeyResult"></span></span>
    </label>
    <label hidden>說話方式
      <select id="talkMode">
        <option value="ptt">按一下說：按一下開始、再按一下送出</option>
        <option value="auto">耐心自動：停約 2 秒才接</option>
        <option value="fast">一般自動：停一下就接</option>
      </select>
      <span class="hint">自動模式請戴耳機。</span>
    </label>
    <label>說話速度：<span id="speedVal"></span>
      <input type="range" id="speed" min="0.7" max="1.2" step="0.05">
      <span class="hint">效果不一定明顯，下次上課生效。</span>
    </label>
    <label>對話模型
      <select id="teacherModel">
        <option value="gemini-3.8-live">gemini-3.8-live（推薦）</option>
        <option value="gemini-3.8-live-extended-thinking">gemini-3.8-live-extended-thinking：想比較久再回答</option>
      </select>
      <span class="hint">下次上課生效。</span>
    </label>
    <label>關於我
      <textarea id="aboutMe" rows="4" placeholder="例如：我是台灣人，正在上 AI 課程，最近用 Claude Code 做 vibe coding，做了一個英文口說練習程式。"></textarea>
      <span class="hint">每堂課開始前會先讀這段。</span>
    </label>
    <label>記憶（每堂課後自動更新）
      <textarea id="profileText" rows="8" spellcheck="false" placeholder="上完第一堂課後自動寫好。"></textarea>
      <span class="hint">可以直接改，清空就會忘掉。</span>
    </label>
    <label>上課風格
      <select id="teacherTemplate"></select>
      <span class="hint">選了會換掉下面的提示詞。</span>
    </label>
    <label>提示詞
      <textarea id="teacherStyle" rows="12" spellcheck="false"></textarea>
      <span class="hint">清空就用回「一對一家教」。</span>
    </label>
    <details class="hint">
      <summary>固定規則（不能改）</summary>
      <pre id="fixedRules"></pre>
    </details>
    <label>筆記模型（要能聽錄音）
      <select id="noteModelSelect"></select>
      <span class="hint" id="noteModelHint">下課前在背景重聽錄音、寫進筆記本。</span>
    </label>
    <label id="noteCustomWrap" hidden>自訂筆記模型名稱
      <input type="text" id="noteModelCustom" placeholder="例如 gemini-3.8-flash">
    </label>
    <label>筆記解釋語言
      <select id="noteLang">
        <option value="zh">繁體中文</option>
        <option value="en">英文</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="showFix"> 句子下面顯示正確說法</label>
    <label class="check"><input type="checkbox" id="webSearch"> 可以上網查時事（每次多一點費用）</label>
    <label class="check"><input type="checkbox" id="pronNotes"> 發音提醒</label>
    <label>糾正程度
      <select id="strict">
        <option value="gentle">溫和：只改會誤會的錯</option>

  old.onclose = () => { log('舊連線已關好（' + secs(performance.now() - window.swapT0) + ' 秒）'); setTimeout(next, 1000); };
  setTimeout(next, 4000);
  try{ old.close(1000, 'swap'); }catch(e){ next(); }
}
/* ---------- 上課中改說話方式：Google 連線的設定中途改不了，所以換一條新連線（用續連代碼接回同一段對話），新連線用新的說話方式。
   按一下說說到一半就去改：這句當作說完了照常送出，老師回完的空檔再換。等的時候麥克風按鈕顯示「切換中」。 ---------- */
let modeSwitch = null, modeWatch = null, pttSending = false;
function modeName(m){ return m === 'ptt' ? '按一下說' : m === 'fast' ? '一般自動' : '耐心自動'; }
function switchMode(mode){
  if(mode !== 'ptt') talkQueued = false;
  if(callState === 'switching' && modeSwitch){ modeSwitch = mode; setCallUI('switching'); return; }   // 還在等換線：改成最後選的
  if(callState === 'off' || callState === 'connecting' || mode === talkMode()) return;
  if(callState === 'paused'){
    callMode = mode;   // 暫停中：直接換（連線還在就馬上換線，斷了的話按繼續重連時就用新的）
    log('說話方式改成' + modeName(mode) + (ws && wsReady ? '，暫停中直接換線' : ''));
    if(ws && wsReady && !swapping) swapSocket();
    return;
  }
  if(pttTurn) finishTalking();   // 說到一半：當作說完了，這句照常送出、老師照常回答
  modeSwitch = mode;
  setCallUI('switching');
  setStatus('');
  log('說話方式要改成' + modeName(mode) + '：等老師回完再換線');
  clearInterval(modeWatch);
  const t0 = performance.now();
  modeWatch = setInterval(() => {
    if(callState !== 'switching' || !modeSwitch){ clearInterval(modeWatch); return; }
    if(talkMode() !== 'ptt' && !autoTurn) setMicOn(false);   // 原本是自動模式：你這句說完就先不收音
    if(!ws || !wsReady || swapping) return;
    if(quietForSwap() || performance.now() - t0 > 30000){
      clearInterval(modeWatch);
      callMode = modeSwitch;   // 新連線的設定會用這個
      swapSocket();
    }
  }, 250);
}
// 讓老師先打招呼：用文字送一句開場指示。按一下說模式有時文字不會觸發回覆，5 秒沒動靜就換另一種送法再試一次
const HABIT_SHORT = {'3s':'the -s on verbs after he, she or it', plural:'the plural -s', past:'past tense', be:'when to use am, is, are', agree:'has and have, is and are, was and were', heshe:'he and she', a_an:'a and an'};
function habitsToday(L){   // 這堂課到目前為止，習慣清單每一項 [機會, 用對]
  const sum = {};
  for(const e of (L && L.habits) || []) for(const [t, v] of Object.entries(e.chances || {})){
    if(!HABIT_SHORT[t] || !Array.isArray(v)) continue;
    sum[t] = sum[t] || [0, 0]; sum[t][0] += parseInt(v[0], 10) || 0; sum[t][1] += parseInt(v[1], 10) || 0;
  }
  return sum;
}
function greetText(){
  const casual = settings.teacherTemplate === 'tutor' || settings.teacherTemplate === 'chat';
  if(!casual) return 'The lesson starts now. Greet the learner.';
  const last = store.get('sngm_lastGreeting', '');
  const focus = habitProgress(null).filter(x => x.status === 'practice').sort((a, b) => a.pct - b.pct).slice(0, 2).map(x => HABIT_SHORT[x.code]);
  return 'The lesson starts now. Greet the learner like a real person would, in one or two short sentences, then ask one question to get them talking. ' +
    'Vary your opening every lesson: do NOT just ask what they did today or what they got up to. You could follow up on something from your notes about them, ask about something coming up for them, mention the day of the week, or pick a light topic. ' +
    (last ? 'Last lesson you opened with: "' + last + '". Open in a clearly different way. ' : '') +
    (focus.length ? 'Also say briefly and warmly that today you will keep an ear on ' + focus.join(' and ') + '. Do not explain any rule.' : '');
}
function greet(){
  const text = greetText();
  send({realtimeInput:{text}});
  log('送出開場指示（realtimeInput.text）');
  clearTimeout(greetTimer);
  greetTimer = setTimeout(() => {
    if(!ws || cur || convo.some(c => c.role === 'Tutor')) return;
    log('5 秒沒有回覆，改用 clientContent 再送一次開場指示');
    send({clientContent:{turns:[{role:'user', parts:[{text}]}], turnComplete:true}});
  }, 5000);
}

// 關掉和老師的連線，收好正在進行的句子（不結束這堂課）
function dropSocket(){
  clearTimeout(greetTimer);
  swapping = false; swapBuf = []; clearInterval(swapWatch);
  if(ws){ const s = ws; ws = null; wsReady = false; try{ s.close(1000, 'bye'); }catch(e){} }
  stopPlayback();
  if(cur){ finishReply(cur, true); cur = null; }
  setMicOn(false);
  if(pttTurn){ pttTurn.bubble.remove(); const i = convo.indexOf(pttTurn.convo); if(i >= 0) convo.splice(i, 1); pttTurn = null; }
  if(autoTurn) autoTurnStop(lastVoiceT || performance.now());
  transcribing = null; serverBusy = false; discarding = false;
  continuation = null; lastTeacher = null; toolPending = 0;
  serverVad = false; lastVoiceT = 0; silentSince = 0;
  $('call').classList.remove('hearing');
}
// 暫停：不送你的聲音、老師的聲音停掉，但這堂課還在
function pauseCall(){
  // 不送 audioStreamEnd：Google 會把它當成「你說完了」而開始回答。只要停止送聲音，老師就會一直等
  setMicOn(false);
  stopPlayback();
  if(cur){ const r = cur; cur = null; finishReply(r, true); if(serverBusy) discarding = true; }
  // 你還沒說完就按暫停：這句作廢，不送筆記員（不然一點按鍵聲也會被腦補成一句話）
  if(autoTurn){
    const u = autoTurn; autoTurn = null;
    const i = convo.indexOf(u.convo); if(i >= 0) convo.splice(i, 1);
    if(transcribing === u) transcribing = null;
    setText(u.bubble, '（暫停了，這句沒記下來）', true);
    log('暫停：還沒說完的那句作廢，不記筆記');
  }
  if(pttTurn){ pttTurn.bubble.remove(); const i = convo.indexOf(pttTurn.convo); if(i >= 0) convo.splice(i, 1); pttTurn = null; }
  $('call').classList.remove('hearing');
  setCallUI('paused');
  setStatus('已暫停');
  log('暫停');
}
// 繼續：連線還在就直接繼續；斷掉了就重新連線，同一堂課接著上
function resumeCall(){
  actx && actx.resume(); pctx && pctx.resume();
  if(swapping && callState === 'paused'){   // 暫停中換說話方式、新連線還在接：不要關掉重開，接好就繼續
    resumeAfterSwap = true; setStatus('換線中，接好就繼續…'); log('換線中按了繼續：接好就繼續');
    return;
  }
  if(ws && wsReady){
    setMicOn(talkMode() !== 'ptt');
    setCallUI(talkMode() === 'ptt' ? 'ready' : 'auto');
    setStatus('繼續');
    log('繼續');
    return;
  }
  rejoin = true; connecting = true; swapping = false; swapBuf = []; clearInterval(swapWatch);
  if(ws){ const s = ws; ws = null; try{ s.close(1000, 'bye'); }catch(e){} }   // 換線到一半：那條不要了，重新連
  setCallUI('connecting'); setStatus('重新連線中…');
  log('重新連線，' + (resumeHandle ? '試著接回原本的對話' : '附上目前的對話'));
  openSocket();
}
// 按「結束課堂」：老師先用一兩句話道別、提一句這堂的表現，講完才掛斷（最多等 15 秒；再按一次就直接結束）
let byeWatch = null;
function sayGoodbye(){
  if(byeWatch || callState === 'talking' || !(ws && wsReady) || !lesson || !(lesson.turns > 0)){ endCall(true); return; }
  const sum = habitsToday(lesson);
  const res = Object.entries(sum).filter(([t, v]) => v[0] >= 2).map(([t, v]) => HABIT_SHORT[t] + ': ' + v[1] + ' of ' + v[0] + ' right');
  const text = 'The learner pressed "End lesson". Say goodbye now in one or two short, warm sentences, like a real tutor at the end of a lesson. ' +
    (res.length ? 'Mention ONE encouraging thing about how they did today, based on these results (do not read out numbers): ' + res.join('; ') + '. ' : 'Mention one nice thing about today\'s lesson. ') +
    'Do not ask any question.';
  setMicOn(false); stopPlayback();
  if(cur){ const r = cur; cur = null; finishReply(r, true); }
  actx && actx.resume(); pctx && pctx.resume();
  setCallUI('ending'); setStatus('道別中…（再按一次「結束課堂」直接結束）');
  const n0 = convo.length, t0 = performance.now();
  send({realtimeInput:{text}});
  log('下課：請老師道別');
  byeWatch = setInterval(() => {
    const said = convo.slice(n0).some(c => c.role === 'Tutor');
    if((said && !serverBusy && !cur && playing_.size === 0) || performance.now() - t0 > 15000) endCall(true);
  }, 300);
}
// 結束課堂：banner 的星球（吉祥物的頭）探頭睜眼一次。減少動態效果時不播
function peekMascot(){
  const sky = $('sky');
  if(!sky || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  sky.classList.remove('peek'); void sky.getBoundingClientRect(); sky.classList.add('peek');
}
$('sky').addEventListener('animationend', e => { if(e.animationName === 'peek') $('sky').classList.remove('peek'); });
// 場景照 1280×200 畫，最高的塔尖離上緣只有 10。視窗比這個比例寬時，slice 會放大切掉上面（塔尖、星球頂），
// 所以改成 meet：高度剛好放進去，左右露出場景本來就往外延伸的地面和天空。比較窄時照舊 slice（切左右）。
// 兩種在比例剛好 6.4 時一模一樣，開場拉遠時跨過去也不會跳。
(function(){
  const sky = $('sky');
  const fit = () => { const r = sky.getBoundingClientRect(); if(r.height) sky.setAttribute('preserveAspectRatio', 'xMidYMax ' + (r.width / r.height > 1280 / 200 ? 'meet' : 'slice')); };
  if(window.ResizeObserver) new ResizeObserver(fit).observe(sky);
  fit();
})();
// 開場動畫：播完、或點一下／按任一鍵就直接跳到最後一格（這一下只用來跳過，不會按到按鈕）
(function(){
  const root = document.documentElement;
  if(!root.classList.contains('intro')) return;
  const skip = e => { e.preventDefault(); e.stopPropagation(); end(); };
  const end = () => { root.classList.remove('intro'); removeEventListener('click', skip, true); removeEventListener('keydown', skip, true); };
  addEventListener('click', skip, true); addEventListener('keydown', skip, true);
  document.querySelector('.layout').addEventListener('animationend', e => { if(e.animationName === 'intro-up') end(); });
  setTimeout(end, 5000);   // 保險：動畫事件沒來也會結束
})();
let memoryJob = null;   // 上一堂課的課堂整理＋記憶更新還在做：開新課要等它，老師才會用到最新的記憶
function endCall(say){
  connecting = false;
  clearInterval(byeWatch); byeWatch = null;
  const g = convo.find(c => c.role === 'Tutor'); if(g && lesson && lesson.turns > 0) store.set('sngm_lastGreeting', g.text.slice(0, 200));
  dropSocket();
  callMode = null; sessionMode = null; modeSwitch = null; clearInterval(modeWatch); pttSending = false;
  setCallUI('off');
  if(say){ setStatus('已下課'); log('結束課堂'); peekMascot(); }
  // 這堂課結束：等筆記員把最後幾句審完，再做課堂整理
  if(lesson){
    const L = lesson; lesson = null;
    if(L.turns > 0){
      L.end = Date.now(); L.status = 'waiting'; saveLesson(L);
      const job = reviewChain.then(() => summarizeLesson(L)).then(() => updateProfile(L)).catch(() => {});
      memoryJob = job; job.then(() => { if(memoryJob === job) memoryJob = null; });
    }else setTimeout(() => chatDb.remove(L.id), 3000);   // 沒說到話的通話不算一堂課，只有招呼的紀錄就丟掉
  }
}

/* ---------- 播放老師的聲音：Google 送來一小段一小段的 24kHz PCM，自己排隊接著播 ---------- */
let pctx = null, playHead = 0;
const playing_ = new Set();   // 正在播或排隊中的片段
function b64ToBytes(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function bytesToB64(bytes){ let bin = ''; for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function playChunk(b64, mime){
  if(!pctx) return;
  const rate = Number((/rate=(\d+)/.exec(mime || '') || [])[1]) || 24000;
  const bytes = b64ToBytes(b64);
  const n = bytes.length >> 1;
  if(!n) return;
  const view = new DataView(bytes.buffer, bytes.byteOffset, n * 2);
  const buf = pctx.createBuffer(1, n, rate);
  const ch = buf.getChannelData(0);
  for(let i = 0; i < n; i++) ch[i] = view.getInt16(i * 2, true) / 32768;
  const src = pctx.createBufferSource();
  src.buffer = buf; src.connect(outNode());   // 經過分析器：麥克風旁的藍色音量條
  // 接在上一段後面播；如果已經播完了（中間有空檔），就稍微留 0.05 秒緩衝再開始
  const now = pctx.currentTime;
  if(playHead < now + 0.02) playHead = now + 0.05;
  src.start(playHead);
  playHead += buf.duration;
  playing_.add(src);
  src.onended = () => playing_.delete(src);
}
function stopPlayback(){
  for(const s of playing_){ try{ s.onended = null; s.stop(); }catch(e){} }
  playing_.clear();
  playHead = 0;
}
function teacherSpeaking(){ return playing_.size > 0; }

/* ---------- 老師的每一次回覆 ---------- */
let cur = null;           // 老師正在講的這一次回覆
let transcribing = null;  // 正在等轉錄文字的那一輪（你說的）
function ensureReply(){
  if(!cur){
    // 自動模式：老師已經開始回答，代表 Google 判斷你說完了；這邊還沒判斷到的話，就以最後一次有聲音的時間當作說完
    if(autoTurn) autoTurnStop(lastVoiceT || performance.now());
    // 這一輪是接在你說完之後的，就從你說完那一刻開始計時
    cur = {bubble:null, t0:lastStop || null, tStart:null, text:'', turn:waitingTurn, recId:newLineId(), lessonId:lesson && lesson.id, t:Date.now()};
    // 查好資料（回想、上網查）後老師接著說的那一段：接在上一個老師泡泡後面，看起來是同一段話
    if(continuation && !waitingTurn){
      cur.bubble = continuation.bubble; cur.prefix = continuation.prefix; cur.t0 = null;
      if(continuation.recId){ cur.recId = continuation.recId; cur.t = continuation.t; cur.meta = continuation.meta; cur.lessonId = continuation.lessonId; }
    }
    continuation = null;
    lastStop = 0; waitingTurn = null;
  }
  return cur;
}
function finishReply(r, interrupted){
  r.text = r.text.replace(/\s+/g, ' ').trim();
  const shown = ((r.prefix || '') + r.text).trim();
  if(r.text){ if(!r.bubble) r.bubble = addBubble('assistant', shown); else setText(r.bubble, shown); }
  if(interrupted && r.bubble) r.bubble.querySelector('.txt').textContent = shown + ' (interrupted)';   // 被你打斷：畫面上標出來
  if(r.t0 && r.bubble){
    const now = performance.now();
    const turn = {start:r.tStart ? r.tStart - r.t0 : null, done:now - r.t0};
    turns.push(turn);
    r.meta = (turn.start != null ? '開口 ' + secs(turn.start) + ' 秒｜' : '') + '寫完 ' + secs(turn.done) + ' 秒';
    setMeta(r.bubble, r.meta);
    log('本輪：開口 ' + (turn.start != null ? secs(turn.start) : '?') + ' 秒，寫完 ' + secs(turn.done) + ' 秒');
    renderStats();
  }
  if(r.text) convo.push({role:'Tutor', text:r.text + (interrupted ? ' (interrupted)' : '')});
  saveTeacherLine(r);
  if(r.bubble) lastTeacher = {bubble:r.bubble, text:shown, recId:r.recId, t:r.t, meta:r.meta, lessonId:r.lessonId};
  // 老師講完（或被你打斷）：和筆記員的結果對照（筆記員在你說完時就開始重聽了）
  if(r.turn && !r.turn.replyDone){
    r.turn.replyDone = performance.now();
    r.turn.replyText = r.text; r.turn.replyInterrupted = !!interrupted;
    settleTurn(r.turn);
  }
}

/* ---------- 處理 Google 傳來的訊息 ---------- */
let audioChunks = 0;
let serverBusy = false;   // Google 那邊這次回覆還沒結束（還沒收到 turnComplete）
let discarding = false;   // 你打斷了老師：舊回覆剩下的聲音和文字直接丟掉，等它結束
function onServer(m, t0){
  if(m.setupComplete){
    wsReady = true; connecting = false; autoRetries = 0;
    log('setupComplete（接通共 ' + secs(performance.now() - t0) + ' 秒）');
    const switched = !!modeSwitch; modeSwitch = null; clearInterval(modeWatch);
    if(swapping){   // 換線完成：畫面和麥克風維持原樣，補送換線時存著的聲音
      swapping = false;
      if(switched || callState === 'switching'){   // 改說話方式的換線：換好了，按鈕改成新的方式
        setCallUI(talkMode() === 'ptt' ? 'ready' : 'auto');
        setMicOn(talkMode() !== 'ptt');
        setStatus('已改成「' + modeName(talkMode()) + '」');
        log('說話方式已改成' + modeName(talkMode()));
      }
      const buf = swapBuf; swapBuf = [];
      for(const b64 of buf) send({realtimeInput:{audio:{mimeType:'audio/pcm;rate=16000', data:b64}}});
      log('換線完成（' + secs(performance.now() - (window.swapT0 || t0)) + ' 秒），' + (usedHandle ? '接回同一段對話' : '已附上目前的對話') + (buf.length ? '，補送 ' + buf.length + ' 段聲音' : ''));
      if(resumeAfterSwap){ resumeAfterSwap = false; if(callState === 'paused') resumeCall(); }
      return;
    }
    setCallUI(talkMode() === 'ptt' ? 'ready' : 'auto');
    setMicOn(talkMode() !== 'ptt');
    if(rejoin){
      setStatus('已重新連上');
      if(usedHandle) log('已接回原本那段對話');
      else{
        log('接不回原本的對話，改成附上目前的對話重新開始');
        send({realtimeInput:{text:'The learner is back after a short break. Say welcome back in one short sentence, then continue the conversation from where it was.'}});
      }
    }else{
      setStatus('已接通');
      greet();
    }
    return;
  }
  if(m.sessionResumptionUpdate){ if(m.sessionResumptionUpdate.resumable && m.sessionResumptionUpdate.newHandle) resumeHandle = m.sessionResumptionUpdate.newHandle; return; }
  if(m.goAway){ onGoAway(m.goAway); return; }
  if(m.voiceActivity){
    const ty = m.voiceActivity.type;
    log('voiceActivity ' + ty);
    if(talkMode() !== 'ptt' && inCall()){
      if(!serverVad){ serverVad = true; log('Google 會告訴我們你何時開始、何時說完，改用它的判斷'); }
      if(ty === 'ACTIVITY_START') autoTurnStart(performance.now());
      else if(ty === 'ACTIVITY_END') autoTurnStop(lastVoiceT || performance.now());
    }
  }
  if(m.toolCall){ onToolCall(m.toolCall); return; }
  if(m.toolCallCancellation){ for(const id of (m.toolCallCancellation.ids || [])) toolCancelled.add(id); log('工具被取消（你打斷了老師）'); return; }
  const sc = m.serverContent;
  if(!sc){ if(!m.usageMetadata && !m.voiceActivity && Object.keys(m).length) log('其他訊息', Object.keys(m)); return; }

  if(sc.inputTranscription && sc.inputTranscription.text){
    // 自動模式：沒偵測到你開始說話，轉錄文字卻先來了，就補開一句
    if(!transcribing && talkMode() !== 'ptt' && inCall()) autoTurnStart(performance.now() - 1000);
    const u = transcribing;
    if(u){
      u.transcript = ((u.transcript || '') + sc.inputTranscription.text).replace(/\s+/g, ' ');
      if(u.convo) u.convo.text = u.transcript.trim();
      if(!u.heard) setText(u.bubble, u.transcript.trim(), false);   // 筆記員好了以後字幕用筆記員的版本，不再被轉錄蓋掉
      if(u.wav) addPlayButton(u.bubble, u.wav);
      if(u.tStop && !u.tTrans){ u.tTrans = performance.now(); setMeta(u.bubble, '轉錄 ' + secs(u.tTrans - u.tStop) + ' 秒'); }
      saveUserLine(u);
    }else log('收到轉錄文字但找不到是哪一句：' + sc.inputTranscription.text);
  }
  if(sc.modelTurn || sc.outputTranscription) serverBusy = true;
  if(sc.modelTurn && sc.modelTurn.parts && !discarding){
    for(const p of sc.modelTurn.parts){
      if(p.inlineData && p.inlineData.data && /audio/.test(p.inlineData.mimeType || 'audio')){
        const r = ensureReply();
        if(!r.tStart) r.tStart = performance.now();
        if(!audioChunks++) log('第一段老師聲音：' + (p.inlineData.mimeType || '(沒寫格式)'));
        if(callState === 'paused'){ if(!r.mutedLogged){ r.mutedLogged = true; log('暫停中：老師的聲音不播（文字照樣顯示）'); } }
        else playChunk(p.inlineData.data, p.inlineData.mimeType);
      }
    }
  }
  if(sc.outputTranscription && sc.outputTranscription.text && !discarding){
    const r = ensureReply();
    r.text += sc.outputTranscription.text;
    if(!r.bubble) r.bubble = addBubble('assistant', r.text.trim());
    else setText(r.bubble, ((r.prefix || '') + r.text).trim());
  }
  if(sc.interrupted){
    log('老師被打斷');
    stopPlayback();
    if(cur){ const r = cur; cur = null; finishReply(r, true); }
    discarding = false;
  }
  if(sc.turnComplete){
    serverBusy = false; discarding = false;
    if(cur){ const r = cur; cur = null; finishReply(r, r.interrupted); }
    if(transcribing && !transcribing.transcript){ setText(transcribing.bubble, '（沒有聽到內容）', false); }
  }
}

/* ---------- 自動模式（耐心自動、一般自動） ----------
   麥克風的聲音降成 16kHz 即時送給老師，由 Google 判斷你什麼時候說完、什麼時候該回答。
   畫面上「你的這一句」從哪裡開始、到哪裡結束：Google 有送 voiceActivity 就用它的；
   沒有的話，用瀏覽器這邊的音量自己判斷（只用來切錄音和算秒數，不影響老師）。 */
let autoTurn = null;      // 自動模式下，你正在說的這一句
let serverVad = false;    // 這次通話 Google 有沒有送 voiceActivity
let lastVoiceT = 0;       // 最後一次聽到你有聲音的時間
let silentSince = 0;
function toPcm16(d, inRate){
  const n = Math.floor(d.length * 16000 / inRate), step = inRate / 16000;
  const out = new Int16Array(n);
  for(let i = 0; i < n; i++){
    const a = Math.floor(i * step), b = Math.max(a + 1, Math.floor((i + 1) * step));
    let s = 0; for(let j = a; j < b && j < d.length; j++) s += d[j];
    s = Math.max(-1, Math.min(1, s / (b - a)));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out;
}
function onMicChunk(t, d, rate){
  if(talkMode() === 'ptt') return;
  if(swapping){   // 換線中：聲音先存著（最多約 15 秒），接通後補送
    if(swapBuf.length < 400) swapBuf.push(bytesToB64(new Uint8Array(toPcm16(d, rate).buffer)));
    return;
  }
  if(!ws || !wsReady) return;
  const pcm = toPcm16(d, rate);
  send({realtimeInput:{audio:{mimeType:'audio/pcm;rate=16000', data:bytesToB64(new Uint8Array(pcm.buffer))}}});
  // 瀏覽器這邊的音量判斷
  let sum = 0; for(let i = 0; i < d.length; i++) sum += d[i] * d[i];
  const loud = Math.sqrt(sum / d.length) * 32768 > VOICE_RMS;
  const chunkMs = d.length / rate * 1000;
  if(loud){
    lastVoiceT = t;
    // 老師在講話時不自己開新的一句（喇叭的聲音可能被收進來）；你真的插話時 Google 會送 interrupted
    if(!serverVad && !autoTurn && !teacherSpeaking()) autoTurnStart(t - chunkMs);
  }else if(autoTurn && !serverVad){

    if(t - lastVoiceT > quiet) autoTurnStop(lastVoiceT);
  }
}
function autoTurnStart(t){
  if(autoTurn) return;
  const u = newUserTurn({bubble:addBubble('user', '（聆聽中…）', true)});
  u.tStart = t;
  convo.push(u.convo = {role:'Learner', text:'(unclear)'});
  autoTurn = u; transcribing = u;
  $('call').classList.add('hearing');
}
function autoTurnStop(tStop){
  const u = autoTurn;
  if(!u) return;
  autoTurn = null;
  $('call').classList.remove('hearing');
  u.tStop = tStop;
  u.wav = cutTurnAudio(u.tStart, tStop + 200, 500);
  const v = u.wav ? voiceLevel(u.wav.pcm) : {voiced:0, peak:0};
  u.voiced = v.voiced;
  if(v.voiced < MIN_VOICED_SECS && !u.transcript){
    // 只是雜音：把這句收掉
    u.bubble.remove(); const i = convo.indexOf(u.convo); if(i >= 0) convo.splice(i, 1);
    if(transcribing === u) transcribing = null;
    u.wav = null;
    return;
  }
  log('你說完了：' + (u.wav ? u.wav.secs.toFixed(1) : '?') + ' 秒，有聲音 ' + v.voiced.toFixed(2) + ' 秒');
  if(!u.transcript) setText(u.bubble, '（轉錄中…）', true);
  if(u.wav) addPlayButton(u.bubble, u.wav);
  saveUserLine(u);
  lastStop = tStop;
  waitingTurn = u;
  startReview(u);
}

/* ---------- 按一下說（push-to-talk） ----------
   說話時先只錄在瀏覽器裡；按「說完了」才把這一句切下來，分成每段 100ms 送給老師，
   前後包上 activityStart / activityEnd。這樣「取消這句」或按太短時，什麼都不用送。 */
let pttTurn = null;          // 正在說的這一輪
let commitTurn = null;       // （舊版用，保留給「新對話」清空）
let activeResponse = null;   // （舊版用，保留給「新對話」清空）
function startTalking(){
  if(callState !== 'ready') return;
  // 老師還在講的話，自己先停掉聲音（Google 那邊收到你的下一句時也會停）
  if(teacherSpeaking() || cur){
    stopPlayback(); log('你開始說話，老師的聲音先停');
    if(cur){ const r = cur; cur = null; finishReply(r, true); }
    if(serverBusy) discarding = true;   // 舊回覆還在送過來：剩下的丟掉
  }
  const u = newUserTurn({bubble:addBubble('user', '（正在聽你說…）', true)});
  convo.push(u.convo = {role:'Learner', text:'(unclear)'});
  pttTurn = u;
  setCallUI('talking');
}
function finishTalking(){
  if(callState !== 'talking' || !pttTurn) return;
  const u = pttTurn; pttTurn = null;
  setCallUI('ready');
  u.tStop = performance.now();
  if(u.tStop - u.tStart < 600){   // 太短，當作按錯
    u.bubble.remove(); convo.splice(convo.indexOf(u.convo), 1);
    setStatus('太短了，說完再按一次');
    return;
  }
  setText(u.bubble, '（轉錄中…）', true);
  pttSending = true;   // 送出之前不要換線（換線會換成別的說話方式）
  // 等 0.3 秒讓最後一個字也錄進來，再切下來送出
  setTimeout(function go(tEnd = performance.now(), tries = 0){
    // 剛好在換線：等新連線接通（最多 6 秒）再送
    if(swapping && tries < 30){ setTimeout(() => go(tEnd, tries + 1), 200); return; }
    pttSending = false;
    if(!ws || !wsReady){ setText(u.bubble, '（沒有送出：連線已中斷）', false); return; }
    u.wav = cutTurnAudio(u.tStart, tEnd, 300);
    if(!u.wav){ setText(u.bubble, '（沒錄到聲音）', false); return; }
    // 沒有說話（只有安靜或雜音）就不送：送出去的話，老師會把雜音聽成別的語言，亂回答
    const v = voiceLevel(u.wav.pcm);
    u.voiced = v.voiced;
    log('這一句的音量：有聲音 ' + v.voiced.toFixed(2) + ' 秒，最大 ' + v.peak);
    if(v.voiced < MIN_VOICED_SECS){
      setText(u.bubble, '（沒聽到你說話，這句沒有送出）', false);
      const i = convo.indexOf(u.convo); if(i >= 0) convo.splice(i, 1);
      u.wav = null;
      log('太安靜，當作沒說話，這句沒有送出');
      setStatus('沒聽到聲音，這句沒有送出');
      return;
    }
    addPlayButton(u.bubble, u.wav);
    saveUserLine(u);
    lastStop = performance.now();
    waitingTurn = u; transcribing = u;
    sendAudio(u.wav.pcm);
    startReview(u);
    log('送出這一句：' + u.wav.secs.toFixed(1) + ' 秒，' + Math.ceil(u.wav.pcm.length / 3200) + ' 段');
  }, 300);
}
// 算一句話裡「真的有人在說話」的時間：每 20ms 算一次音量，夠大的才算
const MIN_VOICED_SECS = 0.2, VOICE_RMS = 400;
const SHORT_VOICED_SECS = 0.6;   // 比這短、又沒有轉錄文字的一句，不送筆記員
function voiceLevel(pcm){
  const view = new DataView(pcm.buffer, pcm.byteOffset, pcm.length - (pcm.length % 2));
  const n = view.byteLength >> 1, win = 320;
  let voicedWins = 0, peak = 0;
  for(let i = 0; i + win <= n; i += win){
    let sum = 0;
    for(let j = i; j < i + win; j++){ const x = view.getInt16(j * 2, true); sum += x * x; }
    const rms = Math.sqrt(sum / win);
    if(rms > peak) peak = rms;
    if(rms > VOICE_RMS) voicedWins++;
  }
  return {voiced:voicedWins * win / 16000, peak:Math.round(peak)};
}
// 把 16kHz、16-bit 的聲音，每 100ms（3200 bytes）一段送出，前後包 activityStart / activityEnd
function sendAudio(pcm){
  send({realtimeInput:{activityStart:{}}});
  for(let i = 0; i < pcm.length; i += 3200){
    send({realtimeInput:{audio:{mimeType:'audio/pcm;rate=16000', data:bytesToB64(pcm.subarray(i, i + 3200))}}});
  }
  send({realtimeInput:{activityEnd:{}}});
}
// 按一下說：講到一半想重來，取消這句，不送給老師
function cancelTalking(){
  if(callState !== 'talking' || !pttTurn) return;
  const u = pttTurn; pttTurn = null;
  u.bubble.remove(); const i = convo.indexOf(u.convo); if(i >= 0) convo.splice(i, 1);
  setCallUI('ready');
  setStatus('已取消這句');
  log('已取消這句（按了「取消這句」），沒有送出');
}
document.addEventListener('keydown', e => {
  if(e.code === 'Escape' && callState === 'talking' && !$('settings').open && !$('lessons').open){ e.preventDefault(); cancelTalking(); return; }
  if(e.code !== 'Space' || $('settings').open || $('lessons').open) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(['input','textarea','select'].includes(tag) || e.target.isContentEditable) return;
  // 空白鍵＝左下的麥克風按鈕（開始上課、說／說完、暫停、繼續）。
  // 不讓空白鍵去按「目前有焦點的按鈕」：關掉設定後焦點會回到「設定」按鈕，以前按空白會又打開設定
  e.preventDefault();

  if(e.target.blur && e.target !== document.body) e.target.blur();
  if(pronBox){ pronBox.talk(); return; }   // 發音小窗開著：空白鍵＝小窗的「● 說」
  // 剛改成按一下說、還在換線（約 1.5 秒）：先記著，換好馬上開始錄你的聲音
  const toPtt = callState === 'switching' ? (modeSwitch || talkMode()) === 'ptt' : (callState === 'auto' && settings.talkMode === 'ptt');
  if(toPtt){ talkQueued = true; setStatus('正在換成「按一下說」…'); return; }
  if(callState === 'auto'){ setStatus('自動模式直接說就好'); return; }
  if(callState === 'switching') return;
  if(!$('call').disabled) $('call').onclick();
});
document.addEventListener('keyup', e => {   // 按鈕是在放開空白鍵時觸發，這裡也擋掉
  if(e.code !== 'Space' || $('settings').open || $('lessons').open) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'button') e.preventDefault();
});

/* ---------- 錄下每一輪你的聲音 ---------- */
// 通話時，瀏覽器在旁邊同步錄一份麥克風聲音（只留最近 2 分鐘），
// 你每說完一句，就依照「開始說／說完」的時間點切下那一段，存成 WAV。
let actx = null, proc = null, ring = [];
function startCapture(stream){
  if(!actx) return;
  try{
    actx.resume();
    const src = actx.createMediaStreamSource(stream);
    proc = actx.createScriptProcessor(2048, 1, 1);   // 每段約 0.04 秒，自動模式送得比較即時
    proc.onaudioprocess = e => {
      const t = performance.now();
      const d = new Float32Array(e.inputBuffer.getChannelData(0));
      ring.push({t, d});
      while(ring.length && t - ring[0].t > 120000) ring.shift();
      if(micSending) onMicChunk(t, d, actx.sampleRate);
    };
    src.connect(proc); proc.connect(actx.destination);   // 輸出是靜音，只是讓它持續運作
    micAn = actx.createAnalyser(); micAn.fftSize = 1024; src.connect(micAn);   // 麥克風旁的音量條
  }catch(e){ log('錄音引擎啟動失敗：' + e.message); }
}
function stopCapture(){
  if(proc){ try{ proc.disconnect(); }catch(e){} proc = null; }
  if(actx){ try{ actx.close(); }catch(e){} actx = null; }
  micAn = null;
  ring = [];
}
function cutTurnAudio(tStart, tStop, pad){
  if(!actx || !ring.length) return null;
  const rate = actx.sampleRate;
  // 自動模式：「開始說」的通知會晚一點才到，所以往前多抓 1.5 秒；按一下說模式：按下就是開始，只多抓 0.3 秒
  const from = tStart - pad, to = tStop;
  const parts = ring.filter(c => c.t >= from && c.t - c.d.length / rate * 1000 <= to);
  const len = parts.reduce((a, c) => a + c.d.length, 0);
  if(len < rate * 0.4) return null;   // 短於 0.4 秒就不算
  const pcm = new Float32Array(len);
  let o = 0; for(const c of parts){ pcm.set(c.d, o); o += c.d.length; }
  return makeWav(pcm, rate, 16000);
}
function makeWav(pcm, inRate, outRate){
  const n = Math.floor(pcm.length * outRate / inRate);
  const view = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (o, s) => { for(let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); w(8, 'WAVE');
  w(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, outRate, true); view.setUint32(28, outRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  w(36, 'data'); view.setUint32(40, n * 2, true);
  const step = inRate / outRate;
  for(let i = 0; i < n; i++){
    // 把附近幾個取樣平均，避免降頻時出現雜音
    const a = Math.floor(i * step), b = Math.max(a + 1, Math.floor((i + 1) * step));
    let s = 0; for(let j = a; j < b && j < pcm.length; j++) s += pcm[j];
    s = Math.max(-1, Math.min(1, s / (b - a)));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  const bytes = new Uint8Array(view.buffer);
  let bin = '';
  for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const blob = new Blob([bytes], {type:'audio/wav'});
  return {b64:btoa(bin), blob, url:URL.createObjectURL(blob), secs:n / outRate, pcm:bytes.subarray(44)};
}
// 重聽：一次只播一段，前一段還沒播完就按，先停掉前一段，從頭播新的。
// 用 Web Audio 播（和老師的聲音同一種方式）：泡泡一出現就先把錄音下載、解碼好放著，按下去馬上出聲。
// 以前用 <audio>，iPhone 每按一次要先載入、暖機，會空白一下；連按還會卡住。Web Audio 不能用時退回 <audio>。
let replayCtx = null, replaySrc = null, replayToken = null;
const replayBufs = new Map();   // 錄音網址 → 解碼好的聲音（Promise）
function getReplayCtx(){
  if(!replayCtx){ try{ replayCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ replayCtx = null; } }
  return replayCtx;
}
function preloadWav(url){
  if(!url) return null;
  if(replayBufs.has(url)) return replayBufs.get(url);
  const ctx = getReplayCtx(); if(!ctx) return null;
  const p = fetch(url).then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(b => new Promise((ok, bad) => ctx.decodeAudioData(b, ok, bad)));   // 舊版 Safari 只支援回呼的寫法
  p.catch(() => replayBufs.delete(url));   // 失敗了下次再試
  replayBufs.set(url, p);
  // 解碼好的聲音很佔記憶體（一句約 1 到 2 MB），只留最近 12 句；舊的被丟掉，再按時重新解碼（錄音在手機裡，很快）
  while(replayBufs.size > 12) replayBufs.delete(replayBufs.keys().next().value);
  return p;
}
function stopReplay(){
  if(replaySrc){ try{ replaySrc.stop(); }catch(e){} replaySrc = null; }
  if(playing) playing.pause();
}
function playWav(url){
  const ctx = getReplayCtx();
  stopReplay();
  const token = replayToken = {};   // 連按：只播最後按的那一次
  const buf = ctx && preloadWav(url);
  if(!buf){ playWavEl(url); return; }
  if(ctx.state !== 'running') ctx.resume().catch(() => {});   // iPhone 要在按下去的當下叫醒
  buf.then(b => {
    if(replayToken !== token) return;
    const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(); replaySrc = s;
  }).catch(() => { if(replayToken === token) playWavEl(url); });
}
// 退路：共用同一個 <audio>（以前每按一次開一個新的，iPhone 連按會卡住）
let playing = null, playingUrl = '';
function playWavEl(url){
  if(playing && playing.error){ playing = null; playingUrl = ''; }   // 播放器出錯了：換一個新的
  if(!playing){ playing = new Audio(); playing.preload = 'auto'; }
  const a = playing;
  a.pause();
  if(playingUrl !== url){ playingUrl = url; a.src = url; }
  else{ try{ a.currentTime = 0; }catch(e){} }
  const p = a.play();
  if(p) p.catch(() => {});
}
function addPlayButton(div, wav){
  if(div.querySelector('.play')) return;
  const b = document.createElement('button');
  b.className = 'play'; b.type = 'button'; b.textContent = '▶ 重聽'; b.title = '重聽這一句（' + wav.secs.toFixed(1) + ' 秒）';
  b.setAttribute('aria-label', '重聽這一句');
  b.onclick = () => playWav(wav.url);
  metaRow(div).appendChild(b);   // 接在秒數後面，同一行
  preloadWav(wav.url);           // 先解碼好，按下去馬上播
}

/* ---------- 發音練習小窗：小小的對話練習 ----------
   入口：字幕上黃底的字、右欄的發音提醒、字幕裡任何一個字。老師先念一次，你按「● 說」（或空白鍵）念，念完再按一次；
   老師聽完開口回你（哪裡不對、示範那個音、再試一次，或 Good!），一直練到你按「收起」。
   打開時上課自動暫停，收起後恢復。小窗關掉就忘記，什麼都不存。 */
const TTS_MODEL = 'gemini-3.8-flash-tts', TTS_VOICE = 'Puck', SLOW_RATE = 0.65;
const PRON_MODEL = 'gemini-3.1-flash-lite';   // 小窗教練專用（要快）；筆記員、課堂整理、記憶仍用 settings.noteModel
let pronBox = null;
function pronCoachPrompt(word, said){
  return `You are a patient, warm English pronunciation coach doing a short voice drill with a Taiwanese learner. The target is: "${word}".${said ? ' Earlier in the lesson it sounded like "' + said + '".' : ''}
Each turn the learner tries to say the target and you hear their latest recording. You also get what happened before in this drill.
Reply like a real coach talking out loud, short and natural:
- If it sounded right: praise briefly and specifically (for example "Good! Your th was perfect."). If they got it right before too, you can tell them they can move on.
- If not: point out ONE problem, the most important one, in plain words (no phonetic symbols, the learner cannot read them). Demonstrate it by saying the sound and then the word (for example "th... th... think"), then ask them to try again. If the problem from last time is fixed, say so first.
- If you hear no clear speech, or a different word, say you didn't catch it and ask them to say "${word}" again.
- Judge each try fresh and carefully, even if earlier tries were good: if any sound clearly differs from standard English (th as s, f or t; v as b or w; r and l mixed up; a long vowel made short; a dropped final consonant), it is NOT right yet. Never invent problems either: a light accent with every sound correct is fine.
Fields:
"reply": what you say out loud, simple English, at most 30 words. A speech engine reads it aloud, so write only words to be spoken: no symbols, no brackets, no Chinese.
"zh": the same advice in one short sentence of Traditional Chinese (Taiwan usage) for the learner to read; "" if it was good.
"heard": a few English words for your own memory of how this try sounded (for example "th sounded like s").

function pcmWav(pcm, rate){   // 萬一回傳的是原始 PCM，包成 wav

}

const HABIT_TYPES = [
  {code:'3s', zh:'第三人稱 -s', en:'third person -s on a present-tense verb other than be/have/do, missing or extra (She mean -> She means; does it means -> does it mean; they likes -> they like)'},
  {code:'plural', zh:'複數 -s', en:'plural -s on a countable noun (two cat -> two cats)'},
  {code:'past', zh:'過去式', en:'past tense, -ed or irregular (Yesterday I go -> went)'},
  {code:'be', zh:'be 動詞多了或少了', en:"a be verb that is missing or extra (I'm prefer -> I prefer; She happy -> She is happy)"},
  {code:'agree', zh:'主詞動詞一致', en:"subject-verb agreement of be/have/do (she have -> has, they is -> are, we was -> were, he don't -> doesn't)"},
  {code:'heshe', zh:'he/she 混用', en:'mixing up he/she, his/her, him/her for the same person'},
  {code:'a_an', zh:'a/an', en:'a vs an (a apple -> an apple, an book -> a book)'}

  const habits = (Array.isArray(o.habits) ? o.habits : []).filter(h => h && HABIT_CODES.includes(h.type) && h.words && h.fix)
    .map(h => ({type:h.type, words:String(h.words), nth:Math.max(1, parseInt(h.nth, 10) || 1), fix:String(h.fix), status:'wrong'}));   // 2026-11-14 使用者決定：含糊和漏講分不出來，一律算確定錯

  const chances = {};
  const raw = o.chances && typeof o.chances === 'object' ? o.chances : {};
  for(const code of HABIT_CODES){
    const wrong = habits.filter(h => h.type === code && h.status === 'wrong').length;
    let n = Array.isArray(raw[code]) ? parseInt(raw[code][0], 10) || 0 : 0;
    if(n < wrong) n = wrong;

function parseNotesJson(text){

      corrected:typeof o.corrected === 'string' ? o.corrected.trim() : '',

      corrections:Array.isArray(o.corrections) ? o.corrections : [],

  let i = 0; while(i < a.length && i < b.length && a[i].toLowerCase() === b[i].toLowerCase()) i++;
  if(i === a.length) return [[a, ''], [b.slice(i), 'add']];   // 只是後面多加：mean → mean(s)、boss → boss( is)
  if(i === b.length) return [[b, ''], [a.slice(i), 'del']];   // 只是後面多了：I'm → I('m)、an → a(n)
  return [[a, 'del'], [' ', ''], [b, 'add']];                 // 整個換掉：go → went

function markText(span, heard, habits, pron){

    if(at >= 0) marks.push({at, end:at + String(h.words).length, h});
  }
  for(const p of pron || []){
    const at = findNth(text, p.meant, 1);
    if(at >= 0) marks.push({at, end:at + String(p.meant).length, p});
  }
  marks.sort((x, y) => x.at - y.at);
  span._sentence = fixedSentence(text, habits);   // 發音小窗「整句」用正確的句子
  span.textContent = '';
  let pos = 0;
  for(const m of marks){
    if(m.at < pos) continue;   // 重疊的跳過
    span.appendChild(document.createTextNode(text.slice(pos, m.at)));
    const orig = text.slice(m.at, m.end);
    if(m.h){
      const w = el('span', 'hab'); w.title = '你說「' + orig + '」，要說「' + m.h.fix + '」';
      for(const [t, k] of habitPieces(orig, m.h.fix)) if(t) w.appendChild(k ? el('span', 'hab-' + k, t) : document.createTextNode(t));
      span.appendChild(w);
    }else{
      const w = el('span', 'pron-mark', orig); w.title = '發音：' + (m.p.said ? '聽起來像「' + m.p.said + '」。' : '') + (m.p.tip || '') + '（點一下練習）'; w._p = m.p;

    }

}
function fixedSentence(heard, habits){   // 把清單內的錯改好的整句
  const text = String(heard || ''); const list = [];
  for(const h of habits || []){ const at = findNth(text, h.words, h.nth); if(at >= 0 && h.fix) list.push({at, end:at + String(h.words).length, fix:h.fix}); }
  list.sort((x, y) => x.at - y.at);
  let out = '', pos = 0;
  for(const m of list){ if(m.at < pos) continue; out += text.slice(pos, m.at) + m.fix; pos = m.end; }
  return out + text.slice(pos);
}
function markedPlain(heard, habits){   // 匯出用：~~刪掉~~ **加上**
  const text = String(heard || ''); const list = [];
  for(const h of habits || []){ const at = findNth(text, h.words, h.nth); if(at >= 0) list.push({at, end:at + String(h.words).length, h}); }
  list.sort((x, y) => x.at - y.at);
  let out = '', pos = 0;
  for(const m of list){
    if(m.at < pos) continue;
    out += text.slice(pos, m.at) + habitPieces(text.slice(m.at, m.end), m.h.fix).map(([t, k]) => !t ? '' : k === 'add' ? '**' + t + '**' : k === 'del' ? '~~' + t + '~~' : t).join('');

}
